<script>
firebase.initializeApp({apiKey:"AIzaSyAr_Fcr_IbMl9syK4zxep3ar9OEHHBppT8",authDomain:"myos-8e487.firebaseapp.com",databaseURL:"https://myos-8e487-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"myos-8e487",storageBucket:"myos-8e487.firebasestorage.app",messagingSenderId:"1020781755391",appId:"1:1020781755391:web:2bb6987486feb02b2ec5ca"});

window.upP=function(i){const f=i.files[0];if(!f||f.size>5e6){t('Max 5MB');return}const r=new FileReader();r.onload=e=>{d.ref('users/'+me.uid+'/pfp').set(e.target.result);$('sa').innerHTML=`<img src="${e.target.result}">`;$('sp').innerHTML=`<img src="${e.target.result}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;t('Photo updated')};r.readAsDataURL(f);i.value=''}
window.lOut=()=>{d.ref('users/'+me.uid+'/online').set(!1);a.signOut()}
window.search=async()=>{const q=$('si').value.trim().toLowerCase();if(q.length<2){$('sr').classList.remove('show');return}const s=await d.ref('usernames').orderByKey().startAt(q).limitToFirst(8).once('value');const r=[];s.forEach(c=>{if(c.key.startsWith(q)&&c.key!==un)r.push(c.key)});$('sr').innerHTML=r.length?r.map(n=>`<div class="si" onclick="sC('${n}')"><div class="av">${n[0].toUpperCase()}</div><div><div style="font-weight:500">${n}</div><div style="font-size:11px;color:var(--t3)">@${n}</div></div></div>`).join(''):'<div style="padding:14px;text-align:center;color:var(--t3);font-size:13px">None</div>';$('sr').classList.add('show')}
document.addEventListener('click',e=>{if(!e.target.closest('.sbox')&&!e.target.closest('.sdrop'))$('sr').classList.remove('show')})

function lC(){d.ref('users/'+me.uid+'/chats').on('value',async s=>{const dt=s.val();if(!dt){$('cl').innerHTML='<div class="empty">Search for someone<br>to start messaging.</div>';return}const it=await Promise.all(Object.entries(dt).sort((a,b)=>(b[1].lt||0)-(a[1].lt||0)).map(async([ci,cd])=>{const u=await d.ref('users/'+cd.w).once('value');const ud=u.val();return{ci,...cd,n:ud.username,ol:ud.online,pf:ud.pfp,ty:ud.typing}}));$('cl').innerHTML=it.map(i=>`<div class="crow" onclick="oC('${i.ci}','${i.n}','${i.w}')"><div style="position:relative"><div class="av lg">${i.pf?`<img src="${i.pf}">`:i.n[0].toUpperCase()}</div>${i.ol?'<div class="od"></div>':''}</div><div class="cinfo"><div class="ctop"><span class="cname">${i.n}</span><span class="ctime">${i.lt?ft(i.lt):''}</span></div><div class="cbot"><span class="cprev">${i.ty?'typing...':(i.lm||'Start chatting')}</span>${i.ur?`<span class="badge">${i.ur}</span>`:''}</div></div></div>`).join('')})}

window.sC=async(n)=>{const s=await d.ref('usernames/'+n).once('value');if(!s.exists())return;const pi=s.val(),ids=[me.uid,pi].sort(),ci=ids[0]+'_'+ids[1];await d.ref().update({['users/'+me.uid+'/chats/'+ci]:{w:pi,lt:Date.now()},['users/'+pi+'/chats/'+ci]:{w:me.uid,lt:Date.now()}});$('si').value='';$('sr').classList.remove('show');oC(ci,n,pi)}
window.oC=function(ci,nm,p){cid=ci;pid=p;$('cn').textContent=nm;$('ma').innerHTML='';d.ref('users/'+p+'/online').on('value',s=>{const e=$('cs');if(s.val()){e.textContent='Online';e.style.color='var(--grn)'}else{e.textContent='Offline';e.style.color='var(--t3)'}});d.ref('users/'+p+'/pfp').once('value').then(s=>{if(s.val())$('ca').innerHTML=`<img src="${s.val()}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;else $('ca').textContent=nm[0].toUpperCase()});if(mr)mr.off();mr=d.ref('chats/'+ci+'/messages').limitToLast(100);let ld=null;mr.on('child_added',s=>{const dt=s.val(),md=new Date(dt.ts).toDateString();if(md!==ld){ad(md,dt.ts);ld=md}rM(s.key,dt)});d.ref('users/'+me.uid+'/chats/'+ci+'/ur').set(0);lt();$('chat').classList.add('act');setTimeout(()=>{$('ma').scrollTop=$('ma').scrollHeight},200)}

function ad(md,ts){const dn=new Date(ts),now=new Date();let l=md;if(md===now.toDateString())l='Today';else{const y=new Date(now);y.setDate(y.getDate()-1);if(md===y.toDateString())l='Yesterday'}$('ma').innerHTML+=`<div class="dsep"><span>${l}</span></div>`}
function rM(k,dt){if($('m-'+k))return;const o=dt.from===me.uid,row=document.createElement('div');row.className='mrow '+(o?'out':'in');row.id='m-'+k;let inr='';if(dt.rp)inr+=`<div style="background:rgba(0,0,0,.15);padding:6px 8px;border-radius:8px;margin-bottom:6px;font-size:12px;border-left:3px solid rgba(255,255,255,.3)">${(dt.rp.t||'').substring(0,80)||'Message'}</div>`;if(dt.tp==='image')inr+=`<img src="${dt.iu}" style="max-width:200px;border-radius:12px;display:block;margin-bottom:2px">`;else if(dt.tp==='voice')inr+=`<div class="vrow" onclick="pV('${dt.au}',this,${dt.dr||5})"><button class="vbtn">▶</button><div class="vbar"><div class="vprog"></div></div><span class="vdur">0:${String(dt.dr||5).padStart(2,'0')}</span></div>`;else inr+=esc(dt.tx||'');inr+=`<span class="mft">${new Date(dt.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})} ${o?(dt.sn?'✓✓':'✓'):''}</span>`;row.innerHTML=`<div class="bub ${o?'out':'in'}" onclick="rpM('${k}')" ondblclick="hM('${k}')">${inr}</div>`;$('ma').appendChild(row);$('ma').scrollTop=$('ma').scrollHeight;if(!o&&!dt.sn)d.ref('chats/'+cid+'/messages/'+k+'/sn').set(!0)}

window.rpM=function(k){const e=$('m-'+k);if(!e)return;const tx=e.querySelector('.bub')?.textContent?.substring(0,100)||'';rp=k;$('rb').classList.add('on');$('rt').textContent=tx;$('mi').focus()}
window.cr=function(){rp=null;$('rb').classList.remove('on')}
window.hM=function(k){d.ref('chats/'+cid+'/messages/'+k+'/rc').transaction(v=>v?null:'❤️')}
window.sndT=function(){const inp=$('mi'),tx=inp.value.trim();if((!tx&&!rp)||!cid)return;const msg={tx,from:me.uid,ts:Date.now(),tp:'text',sn:!1};if(rp){d.ref('chats/'+cid+'/messages/'+rp).once('value').then(s=>{const dt=s.val();msg.rp={t:dt.tx||'',tp:dt.tp||'text'};d.ref('chats/'+cid+'/messages').push(msg)});cr()}else{d.ref('chats/'+cid+'/messages').push(msg)}uM(tx||'Reply');inp.value='';inp.focus();d.ref('users/'+me.uid+'/typing').set(!1)}
window.sndM=function(i){const f=i.files[0];if(!f||!cid)return;if(f.size>1e7){t('Max 10MB');i.value='';return}const r=new FileReader();r.onload=e=>{d.ref('chats/'+cid+'/messages').push({iu:e.target.result,from:me.uid,ts:Date.now(),tp:'image',sn:!1});uM('Image')};r.readAsDataURL(f);i.value=''}
window.sndP=function(){if(!cid)return;const q=prompt('Poll question:'),op=prompt('Options (comma):','Yes,No');if(!q||!op)return;d.ref('chats/'+cid+'/messages').push({tx:'📊 '+q+'\n'+op.split(',').map(o=>'• '+o.trim()).join('\n'),from:me.uid,ts:Date.now(),tp:'text',sn:!1});uM('Poll')}
function uM(lm){const u={};u['users/'+me.uid+'/chats/'+cid+'/lm']=lm;u['users/'+me.uid+'/chats/'+cid+'/lt']=Date.now();u['users/'+pid+'/chats/'+cid+'/lm']=lm;u['users/'+pid+'/chats/'+cid+'/lt']=Date.now();d.ref('users/'+pid+'/chats/'+cid+'/ur').transaction(v=>(v||0)+1);d.ref().update(u)}
window.sRec=async()=>{if(!cid)return;try{const s=await navigator.mediaDevices.getUserMedia({audio:!0});rec=new MediaRecorder(s);ch=[];rec.ondataavailable=e=>ch.push(e.data);rec.onstop=()=>{const b=new Blob(ch,{type:'audio/webm'}),r=new FileReader();r.onload=e=>{const dr=Math.max(1,Math.round(ch.length*.08));d.ref('chats/'+cid+'/messages').push({au:e.target.result,dr,from:me.uid,ts:Date.now(),tp:'voice',sn:!1});uM('Voice')};r.readAsDataURL(b);s.getTracks().forEach(t=>t.stop())};rec.start();ing=!0;$('vb').classList.add('rec');t('Recording...')}catch(e){t('Mic denied')}}
window.eRec=()=>{if(rec&&ing){rec.stop();ing=!1;$('vb').classList.remove('rec')}}
window.pV=function(url,el,dr){if(ca){ca.pause();ca=null}const au=new Audio(url);ca=au;const btn=el.querySelector('.vbtn'),bar=el.querySelector('.vprog'),tm=el.querySelector('.vdur');btn.textContent='⏸';au.play();au.ontimeupdate=()=>{if(au.duration){bar.style.width=(au.currentTime/au.duration)*100+'%';tm.textContent='0:'+String(Math.ceil(au.duration-au.currentTime)).padStart(2,'0')}};au.onended=()=>{btn.textContent='▶';bar.style.width='0%';tm.textContent='0:'+String(dr).padStart(2,'0');ca=null};btn.onclick=e=>{e.stopPropagation();if(au.paused){au.play();btn.textContent='⏸'}else{au.pause();btn.textContent='▶'}}}

let tt;$('mi').addEventListener('input',()=>{d.ref('users/'+me.uid+'/typing').set(!0);clearTimeout(tt);tt=setTimeout(()=>d.ref('users/'+me.uid+'/typing').set(!1),2000)})
function lt(){d.ref('users/'+pid+'/typing').on('value',s=>{const e=$('cs');if(s.val()){e.textContent='typing...';e.style.color='var(--a1)'}else{d.ref('users/'+pid+'/online').once('value').then(o=>{e.textContent=o.val()?'Online':'Offline';e.style.color=o.val()?'var(--grn)':'var(--t3)'})}})}
function clC(){$('chat').classList.remove('act');if(mr)mr.off();mr=null;cid=null;pid=null;rp=null;cr()}
window.clC=clC
window.openSet=()=>{$('set').classList.add('act');$('sU').textContent='@'+un;$('sE').textContent=me.email;lp()}
window.clS=()=>$('set').classList.remove('act')
window.openPr=function(p){if(!p)return;t('Profile: @'+(p===me.uid?un:'user'))}
window.startVC=()=>{t('Voice call started (simulated)')}
window.startVC2=()=>{t('Video call started (simulated)')}
window.st=function(tb){document.querySelectorAll('.ntab').forEach(x=>x.classList.remove('act'));$('t'+tb)?.classList.add('act')}
</script>
</body>
</html>
