<!DOCTYPE html>
<html>
<head>
    <title>Link — Draw Together</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Link">
    <meta name="theme-color" content="#050505">
    <meta name="description" content="Draw, chat, and share together in real time.">
    <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIkxpbmsiLAogICJzaG9ydF9uYW1lIjogIkxpbmsiLAogICJzdGFydF91cmwiOiAiLiIsCiAgImRpc3BsYXkiOiAic3RhbmRhbG9uZSIsCiAgImJhY2tncm91bmRfY29sb3IiOiAiIzA1MDUwNSIsCiAgInRoZW1lX2NvbG9yIjogIiMwNTA1MDUiLAogICJkZXNjcmlwdGlvbiI6ICJEcmF3LCBjaGF0LCBhbmQgc2hhcmUgdG9nZXRoZXIgaW4gcmVhbCB0aW1lLiIsCiAgImljb25zIjogWwogICAgewogICAgICAic3JjIjogImh0dHBzOi8vaS5pYmIuY28vZmQ1MUhwN2YvaWNvbi5wbmciLAogICAgICAic2l6ZXMiOiAiNTEyeDUxMiIsCiAgICAgICJ0eXBlIjogImltYWdlL3BuZyIsCiAgICAgICJwdXJwb3NlIjogImFueSIKICAgIH0KICBdCn0">
    <link rel="apple-touch-icon" href="https://i.ibb.co/fd51Hp7f/icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #050505;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .screen.hidden { opacity: 0; pointer-events: none; transform: scale(0.96); }

        #welcome-screen { text-align: center; color: white; padding: 40px 30px; }
        .logo { width: 90px; height: 90px; margin: 0 auto 24px; border-radius: 22px; overflow: hidden; box-shadow: 0 20px 60px rgba(99, 102, 241, 0.3); animation: float 3s ease-in-out infinite; }
        .logo img { width: 100%; height: 100%; object-fit: cover; }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
        #welcome-screen h1 { font-size: 40px; font-weight: 800; margin-bottom: 4px; letter-spacing: -1px; background: linear-gradient(135deg, #e0e7ff, #c4b5fd); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        #welcome-screen .subtitle { color: rgba(255,255,255,0.45); font-size: 15px; font-weight: 400; margin-bottom: 32px; letter-spacing: 0.3px; }
        .btn-primary { padding: 16px 36px; font-size: 16px; border-radius: 16px; border: none; background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; cursor: pointer; font-weight: 600; width: 100%; max-width: 300px; letter-spacing: 0.3px; transition: all 0.2s; box-shadow: 0 8px 30px rgba(99, 102, 241, 0.25); font-family: 'Inter', sans-serif; }
        .btn-primary:active { transform: scale(0.96); }
        .btn-secondary { padding: 14px 28px; font-size: 14px; border-radius: 14px; border: 1.5px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.8); cursor: pointer; font-weight: 500; margin: 6px; transition: all 0.2s; font-family: 'Inter', sans-serif; backdrop-filter: blur(10px); }
        .btn-secondary:active { background: rgba(255,255,255,0.1); }
        .btn-danger { padding: 14px 28px; font-size: 14px; border-radius: 14px; border: 1.5px solid rgba(239, 68, 68, 0.3); background: rgba(239, 68, 68, 0.08); color: #fca5a5; cursor: pointer; font-weight: 500; margin: 6px; transition: all 0.2s; font-family: 'Inter', sans-serif; }
        .btn-danger:active { background: rgba(239, 68, 68, 0.2); }
        .btn-small { padding: 8px 14px; font-size: 11px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.7); cursor: pointer; font-weight: 500; font-family: 'Inter', sans-serif; }
        .btn-small:active { background: rgba(255,255,255,0.12); }

        #install-banner { display: none; position: fixed; bottom: 20px; left: 16px; right: 16px; background: rgba(18, 18, 18, 0.95); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 16px 20px; z-index: 300; backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); align-items: center; justify-content: space-between; gap: 12px; }
        #install-banner.show { display: flex; }
        #install-banner .install-icon { width: 48px; height: 48px; border-radius: 12px; overflow: hidden; flex-shrink: 0; }
        #install-banner .install-icon img { width: 100%; height: 100%; object-fit: cover; }
        #install-banner .install-info { flex: 1; min-width: 0; }
        #install-banner .install-title { color: white; font-size: 14px; font-weight: 600; }
        #install-banner .install-sub { color: rgba(255,255,255,0.5); font-size: 12px; margin-top: 2px; }
        #install-banner .install-btn { padding: 10px 20px; border-radius: 50px; border: none; background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; font-family: 'Inter', sans-serif; }
        #install-banner .dismiss-btn { background: none; border: none; color: rgba(255,255,255,0.3); font-size: 20px; cursor: pointer; padding: 4px; }

        #connect-screen { text-align: center; color: white; padding: 40px 30px; }
        #connect-screen h2 { font-size: 26px; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.5px; }
        #connect-screen .desc { color: rgba(255,255,255,0.4); font-size: 14px; margin-bottom: 28px; font-weight: 400; }
        .code-display { background: rgba(255,255,255,0.04); padding: 24px 20px; border-radius: 24px; margin: 20px 0; border: 1.5px solid rgba(255,255,255,0.08); backdrop-filter: blur(10px); }
        .code-display .label { font-size: 10px; color: rgba(255,255,255,0.35); text-transform: uppercase; letter-spacing: 3px; margin-bottom: 10px; font-weight: 600; }
        .code-display .code { font-size: 40px; font-weight: 800; letter-spacing: 8px; background: linear-gradient(135deg, #a5b4fc, #c4b5fd); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        #connect-screen input { padding: 16px; font-size: 16px; border-radius: 16px; border: 1.5px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: white; text-align: center; width: 100%; max-width: 280px; outline: none; margin-bottom: 8px; transition: border 0.3s; font-family: 'Inter', sans-serif; letter-spacing: 2px; font-weight: 500; }
        #connect-screen input:focus { border-color: #6366f1; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15); }
        #connect-error { color: #fca5a5; font-size: 13px; margin-top: 10px; min-height: 20px; font-weight: 500; }
        #user-display { color: rgba(255,255,255,0.35); font-size: 12px; margin-top: 20px; font-weight: 500; }
        .success-msg { color: #6ee7b7 !important; }

        #drawing-screen { width: 100vw; height: 100vh; height: 100dvh; position: fixed; top: 0; left: 0; background: #050505; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }

        #toolbar { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 5px; background: rgba(18, 18, 18, 0.92); padding: 6px 8px; border-radius: 50px; backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); z-index: 200; border: 1px solid rgba(255,255,255,0.08); align-items: center; }
        .tool-btn { width: 34px; height: 34px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 15px; transition: all 0.2s; background: transparent; color: rgba(255,255,255,0.6); }
        .tool-btn.active { background: rgba(255,255,255,0.1); color: white; }
        .tool-btn:active { transform: scale(0.9); }
        .tool-btn.heart-btn { color: #ef4444; font-size: 18px; }
        .tool-btn.heart-btn:active { background: rgba(239, 68, 68, 0.3); transform: scale(1.1); }
        .tool-btn.chat-btn { position: relative; }
        .chat-badge { position: absolute; top: 2px; right: 2px; width: 10px; height: 10px; background: #ef4444; border-radius: 50%; display: none; }
        .chat-badge.show { display: block; }
        #brush-sizes { display: flex; gap: 5px; align-items: center; padding: 0 4px; }
        .brush-dot { border-radius: 50%; background: white; cursor: pointer; transition: all 0.2s; border: 2px solid transparent; }
        .brush-dot.small { width: 6px; height: 6px; }
        .brush-dot.medium { width: 11px; height: 11px; }
        .brush-dot.large { width: 16px; height: 16px; }
        .brush-dot.active { border-color: #6366f1; box-shadow: 0 0 10px rgba(99, 102, 241, 0.5); }
        #color-row { display: flex; gap: 5px; padding: 0 2px; }
        .color-dot { width: 20px; height: 20px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; flex-shrink: 0; }
        .color-dot:active { transform: scale(1.2); }
        .color-dot.active { border-color: white; box-shadow: 0 0 12px currentColor; }

        #top-bar { position: fixed; top: 16px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: flex-start; z-index: 200; pointer-events: none; }
        #top-bar > * { pointer-events: auto; }
        .top-pill { padding: 10px 16px; background: rgba(18, 18, 18, 0.85); border-radius: 50px; backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border: 1px solid rgba(255,255,255,0.08); color: rgba(255,255,255,0.8); font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
        .top-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .icon-btn { width: 40px; height: 40px; border-radius: 50%; background: rgba(18, 18, 18, 0.85); border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); color: white; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .icon-btn:active { background: rgba(239, 68, 68, 0.4); }

        #streak-badge { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); background: rgba(18, 18, 18, 0.9); border: 1px solid rgba(255,255,255,0.1); border-radius: 50px; padding: 8px 16px; z-index: 199; backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); display: none; align-items: center; gap: 6px; color: white; font-size: 13px; font-weight: 600; }
        #streak-badge.show { display: flex; }
        #streak-badge .streak-fire { font-size: 18px; animation: bounce 0.6s infinite alternate; }
        @keyframes bounce { from { transform: scale(1); } to { transform: scale(1.2); } }

        /* Music Player */
        #music-bar { position: fixed; bottom: 100px; left: 16px; right: 16px; background: rgba(18, 18, 18, 0.92); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 10px 14px; z-index: 198; backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); display: none; align-items: center; gap: 10px; }
        #music-bar.show { display: flex; }
        #music-bar input { flex: 1; padding: 8px 12px; font-size: 11px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: white; outline: none; font-family: 'Inter', sans-serif; min-width: 0; }
        #music-bar input::placeholder { color: rgba(255,255,255,0.3); }
        .music-ctrl { width: 32px; height: 32px; border-radius: 50%; border: none; cursor: pointer; background: rgba(255,255,255,0.1); color: white; font-size: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .music-ctrl.play-btn { background: #6366f1; }

        /* Voice Recording */
        #voice-record-btn { position: relative; }
        #voice-record-btn.recording { background: #ef4444 !important; color: white !important; animation: pulse-rec 1s infinite; }
        @keyframes pulse-rec { 0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); } 50% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); } }
        .voice-msg { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .voice-msg .play-pause { width: 32px; height: 32px; border-radius: 50%; border: none; background: #6366f1; color: white; font-size: 14px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
        .voice-msg .waveform { flex: 1; height: 24px; background: rgba(255,255,255,0.06); border-radius: 12px; overflow: hidden; position: relative; min-width: 60px; }
        .voice-msg .progress { height: 100%; background: rgba(99, 102, 241, 0.5); border-radius: 12px; width: 0%; transition: width 0.1s linear; }
        .voice-msg .duration { font-size: 11px; color: rgba(255,255,255,0.5); flex-shrink: 0; }

        .floating-heart { position: fixed; z-index: 250; pointer-events: none; font-size: 40px; animation: heartFloat 2s ease-out forwards; }
        @keyframes heartFloat { 0% { opacity: 1; transform: translateY(0) scale(0.5); } 30% { opacity: 1; transform: translateY(-60px) scale(1.4); } 100% { opacity: 0; transform: translateY(-200px) scale(0.8); } }

        #share-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 299; display: none; }
        #share-overlay.show { display: block; }
        #share-panel { position: fixed; bottom: 50%; left: 50%; transform: translate(-50%, 50%); background: rgba(18, 18, 18, 0.98); border: 1px solid rgba(255,255,255,0.12); border-radius: 24px; padding: 24px; z-index: 300; backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); display: none; text-align: center; color: white; min-width: 260px; }
        #share-panel.show { display: block; }
        #share-panel h3 { margin-bottom: 16px; font-size: 18px; }
        #share-panel img { max-width: 200px; border-radius: 12px; margin-bottom: 16px; border: 1px solid rgba(255,255,255,0.1); }

        #chat-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 249; display: none; }
        #chat-overlay.show { display: block; }
        #chat-panel { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(14, 14, 14, 0.98); border-radius: 24px 24px 0 0; z-index: 250; backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border-top: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; height: 65vh; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        #chat-panel.show { transform: translateY(0); }
        #chat-header { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; justify-content: space-between; align-items: center; color: white; font-weight: 600; font-size: 16px; }
        #chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
        .chat-msg { max-width: 75%; padding: 10px 14px; border-radius: 18px; font-size: 14px; line-height: 1.4; word-break: break-word; animation: msgIn 0.3s ease-out; }
        @keyframes msgIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .chat-msg.sent { align-self: flex-end; background: #6366f1; color: white; border-bottom-right-radius: 4px; }
        .chat-msg.received { align-self: flex-start; background: rgba(255,255,255,0.08); color: white; border-bottom-left-radius: 4px; }
        .chat-msg img { max-width: 200px; border-radius: 12px; cursor: pointer; }
        .chat-time { font-size: 10px; opacity: 0.5; margin-top: 4px; }
        #chat-input-area { padding: 12px 16px; border-top: 1px solid rgba(255,255,255,0.06); display: flex; gap: 8px; align-items: center; }
        #chat-input { flex: 1; padding: 12px 16px; border-radius: 25px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.06); color: white; outline: none; font-size: 14px; font-family: 'Inter', sans-serif; }
        #chat-input::placeholder { color: rgba(255,255,255,0.3); }
        #send-btn { width: 42px; height: 42px; border-radius: 50%; border: none; background: #6366f1; color: white; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        #media-btn { width: 42px; height: 42px; border-radius: 50%; border: none; background: rgba(255,255,255,0.1); color: white; cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        #file-input { display: none; }
        #voice-record-btn { width: 42px; height: 42px; border-radius: 50%; border: none; background: rgba(255,255,255,0.1); color: white; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s; }

        #status-toast { position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%) translateY(20px); color: white; font-size: 12px; font-weight: 500; background: rgba(18, 18, 18, 0.9); padding: 8px 18px; border-radius: 50px; z-index: 200; pointer-events: none; opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.06); }
        #status-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <div id="welcome-screen" class="screen">
        <div>
            <div class="logo"><img src="https://i.ibb.co/fd51Hp7f/icon.png" alt="Link"></div>
            <h1>Link</h1>
            <p class="subtitle">Draw, chat, and share together.<br>Just you and one other person.</p>
            <button class="btn-primary" id="google-login-btn">Sign in with Google</button>
        </div>
    </div>

    <div id="connect-screen" class="screen hidden">
        <div>
            <h2>👋 Connect</h2>
            <p class="desc">Share your code or enter theirs</p>
            <div class="code-display"><div class="label">Your Code</div><div class="code" id="my-code">----</div></div>
            <input type="text" id="partner-code-input" placeholder="Enter their code" maxlength="6" autocomplete="off" autocapitalize="characters">
            <br>
            <button class="btn-primary" onclick="connectWithPartner()" style="margin-top:8px;">Connect</button>
            <br>
            <button class="btn-secondary" onclick="copyCode()">📋 Copy My Code</button>
            <button class="btn-danger" onclick="signOut()">Sign Out</button>
            <p id="connect-error"></p>
            <p id="user-display"></p>
        </div>
    </div>

    <div id="drawing-screen" class="screen hidden">
        <canvas id="wallpaper"></canvas>
        <div id="top-bar">
            <div class="top-pill"><span class="dot"></span><span id="partner-name">Connected</span></div>
            <div style="display:flex; gap:8px;">
                <button class="icon-btn" onclick="toggleMusic()" title="Music">🎵</button>
                <button class="icon-btn" onclick="goBack()" title="Disconnect">←</button>
                <button class="icon-btn" onclick="shareDrawing()" title="Share">📤</button>
                <button class="icon-btn" onclick="clearWallpaper()" title="Clear">🗑</button>
            </div>
        </div>
        <div id="streak-badge"><span class="streak-fire">🔥</span><span id="streak-count">1</span> day streak</div>
        <div id="status-toast">Ready</div>

        <div id="music-bar">
            <span style="font-size:14px;">🎵</span>
            <input type="text" id="youtube-link" placeholder="Paste YouTube link...">
            <button class="music-ctrl play-btn" onclick="syncMusic()">▶</button>
            <button class="music-ctrl" onclick="stopMusic()">⏹</button>
        </div>

        <div id="toolbar">
            <button class="tool-btn chat-btn" onclick="toggleChat()" title="Chat">💬<span class="chat-badge" id="chat-badge"></span></button>
            <div style="width:1px; height:20px; background:rgba(255,255,255,0.1); margin:0 2px;"></div>
            <button class="tool-btn active" id="pen-tool" onclick="setTool('pen')">✏️</button>
            <button class="tool-btn" id="marker-tool" onclick="setTool('marker')">🖍</button>
            <button class="tool-btn" id="spray-tool" onclick="setTool('spray')">🎨</button>
            <div style="width:1px; height:20px; background:rgba(255,255,255,0.1); margin:0 2px;"></div>
            <div id="brush-sizes">
                <div class="brush-dot small active" data-size="2" onclick="setBrushSize(2, this)"></div>
                <div class="brush-dot medium" data-size="5" onclick="setBrushSize(5, this)"></div>
                <div class="brush-dot large" data-size="12" onclick="setBrushSize(12, this)"></div>
            </div>
            <div style="width:1px; height:20px; background:rgba(255,255,255,0.1); margin:0 2px;"></div>
            <div id="color-row">
                <div class="color-dot active" style="background:#ffffff;" data-color="#ffffff"></div>
                <div class="color-dot" style="background:#ef4444;" data-color="#ef4444"></div>
                <div class="color-dot" style="background:#f59e0b;" data-color="#f59e0b"></div>
                <div class="color-dot" style="background:#10b981;" data-color="#10b981"></div>
                <div class="color-dot" style="background:#6366f1;" data-color="#6366f1"></div>
                <div class="color-dot" style="background:#ec4899;" data-color="#ec4899"></div>
                <div class="color-dot" style="background:#8b5cf6;" data-color="#8b5cf6"></div>
            </div>
            <div style="width:1px; height:20px; background:rgba(255,255,255,0.1); margin:0 2px;"></div>
            <button class="tool-btn heart-btn" onclick="sendHeart()" title="Send Heart">❤️</button>
        </div>

        <div id="chat-overlay" onclick="closeChat()"></div>
        <div id="chat-panel">
            <div id="chat-header"><span>💬 Chat</span><button onclick="closeChat()" style="background:none;border:none;color:rgba(255,255,255,0.5);font-size:20px;cursor:pointer;">✕</button></div>
            <div id="chat-messages"></div>
            <div id="chat-input-area">
                <button id="media-btn" onclick="document.getElementById('file-input').click()">📎</button>
                <input type="file" id="file-input" accept="image/*" onchange="sendMedia(this)">
                <input type="text" id="chat-input" placeholder="Type a message..." onkeypress="if(event.key==='Enter')sendMessage()">
                <button id="voice-record-btn" onmousedown="startRecording()" onmouseup="stopRecording()" onmouseleave="stopRecording()" ontouchstart="startRecording()" ontouchend="stopRecording()">🎤</button>
                <button id="send-btn" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <div id="share-overlay" onclick="closeShare()"></div>
    <div id="share-panel">
        <h3>📤 Share Drawing</h3>
        <img id="share-image" src="" alt="Drawing">
        <button class="btn-primary" onclick="downloadImage()">💾 Save Image</button>
        <button class="btn-secondary" onclick="closeShare()" style="margin-top:8px;">Close</button>
    </div>

    <div id="install-banner">
        <div class="install-icon"><img src="https://i.ibb.co/fd51Hp7f/icon.png" alt="Link"></div>
        <div class="install-info"><div class="install-title">Install Link</div><div class="install-sub">Add to home screen</div></div>
        <button class="install-btn" id="install-btn">Install</button>
        <button class="dismiss-btn" id="dismiss-btn">✕</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAr_Fcr_IbMl9syK4zxep3ar9OEHHBppT8",
            authDomain: "myos-8e487.firebaseapp.com",
            databaseURL: "https://myos-8e487-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "myos-8e487",
            storageBucket: "myos-8e487.firebasestorage.app",
            messagingSenderId: "1020781755391",
            appId: "1:1020781755391:web:2bb6987486feb02b2ec5ca"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        // PWA
        let deferredPrompt;
        const installBanner = document.getElementById('install-banner');
        window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; installBanner.classList.add('show'); });
        document.getElementById('install-btn').addEventListener('click', async () => { if (deferredPrompt) { deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; installBanner.classList.remove('show'); } });
        document.getElementById('dismiss-btn').addEventListener('click', () => installBanner.classList.remove('show'));

        // State
        let currentUser = null, myCode = "", partnerCode = "", roomId = "";
        let currentColor = "#ffffff", brushSize = 2, currentTool = "pen";
        let isDrawing = false, canvas, ctx, lastX = 0, lastY = 0, lastTimestamp = 0, sprayInterval = null;
        let unreadMessages = 0, chatOpen = false;
        let mediaRecorder, audioChunks = [], isRecording = false;
        let musicPlayer = null, musicBarOpen = false;
        let lastHeartTimestamp = 0;

        // Canvas
        canvas = document.getElementById('wallpaper');
        ctx = canvas.getContext('2d');
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        function resizeCanvas() { const img = ctx.getImageData(0, 0, canvas.width, canvas.height); canvas.width = window.innerWidth; canvas.height = window.innerHeight; ctx.putImageData(img, 0, 0); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; }
        window.addEventListener('resize', resizeCanvas);

        const welcomeScreen = document.getElementById('welcome-screen');
        const connectScreen = document.getElementById('connect-screen');
        const drawingScreen = document.getElementById('drawing-screen');
        function showScreen(s) { [welcomeScreen, connectScreen, drawingScreen].forEach(x => x.classList.add('hidden')); s.classList.remove('hidden'); }
        function showToast(msg, d = 1500) { const t = document.getElementById('status-toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), d); }

        // Auth
        document.getElementById('google-login-btn').addEventListener('click', () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => alert("Login failed")));
        auth.onAuthStateChanged(user => {
            if (user) { currentUser = user; showScreen(connectScreen); document.getElementById('user-display').textContent = `Signed in as: ${user.displayName}`; setupUser(); }
            else { currentUser = null; showScreen(welcomeScreen); }
        });

        function setupUser() {
            myCode = currentUser.uid.substring(0, 6).toUpperCase();
            document.getElementById('my-code').textContent = myCode;
            database.ref('users/' + currentUser.uid).set({ name: currentUser.displayName, code: myCode, lastSeen: Date.now() });
            database.ref('users/' + currentUser.uid + '/connectedTo').on('value', snapshot => {
                const data = snapshot.val();
                if (data && data.partnerId) { partnerCode = data.partnerCode; roomId = data.roomId; openDrawingScreen(data.partnerName); }
            });
        }

        function connectWithPartner() {
            const inputCode = document.getElementById('partner-code-input').value.trim().toUpperCase();
            const err = document.getElementById('connect-error');
            if (!inputCode) { err.textContent = "Enter a code"; return; }
            if (inputCode === myCode) { err.textContent = "That's your own code"; return; }
            err.textContent = "Looking..."; err.className = '';
            database.ref('users').orderByChild('code').equalTo(inputCode).once('value').then(snapshot => {
                if (snapshot.exists()) {
                    const data = snapshot.val(), pid = Object.keys(data)[0], pn = data[pid].name || "Partner";
                    const ids = [currentUser.uid, pid].sort(); roomId = ids[0] + '_' + ids[1]; partnerCode = inputCode;
                    const updates = {};
                    updates['users/' + currentUser.uid + '/connectedTo'] = { partnerId: pid, partnerCode, roomId, partnerName: pn };
                    updates['users/' + pid + '/connectedTo'] = { partnerId: currentUser.uid, partnerCode: myCode, roomId, partnerName: currentUser.displayName };
                    return database.ref().update(updates);
                } else { err.textContent = "Code not found."; throw new Error("nf"); }
            }).then(() => { err.textContent = ""; openDrawingScreen(); }).catch(e => { if (e.message !== "nf") err.textContent = "Failed."; });
        }
        window.connectWithPartner = connectWithPartner;
        function copyCode() { const err = document.getElementById('connect-error'); navigator.clipboard.writeText(myCode).then(() => { err.textContent = "✅ Copied!"; err.className = 'success-msg'; setTimeout(() => { err.textContent = ""; err.className = ''; }, 2000); }).catch(() => { err.textContent = "Code: " + myCode; }); }
        window.copyCode = copyCode;
        function signOut() { if (currentUser && roomId) database.ref('users/' + currentUser.uid + '/connectedTo').remove(); auth.signOut(); }
        window.signOut = signOut;

        function openDrawingScreen(pn) {
            showScreen(drawingScreen); resizeCanvas();
            document.getElementById('partner-name').textContent = pn || "Connected";
            lastTimestamp = 0; updateStreak(); loadCanvas(); startListening(); startChatListener(); startHeartListener(); startMusicListener();
        }
        function goBack() { showScreen(connectScreen); if (currentUser) database.ref('users/' + currentUser.uid + '/connectedTo').remove(); partnerCode = ""; roomId = ""; stopMusic(); showToast("Disconnected"); }
        window.goBack = goBack;

        // Tools
        function setTool(t) { currentTool = t; document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active')); if (document.getElementById(t + '-tool')) document.getElementById(t + '-tool').classList.add('active'); if (sprayInterval) { clearInterval(sprayInterval); sprayInterval = null; } }
        window.setTool = setTool;
        function setBrushSize(s, el) { brushSize = s; document.querySelectorAll('.brush-dot').forEach(d => d.classList.remove('active')); el.classList.add('active'); }
        window.setBrushSize = setBrushSize;
        function getPos(e) { const r = canvas.getBoundingClientRect(); return { x: (e.clientX - r.left) * (canvas.width / r.width), y: (e.clientY - r.top) * (canvas.height / r.height) }; }
        function startDraw(e) { isDrawing = true; const p = getPos(e); lastX = p.x; lastY = p.y; if (currentTool === 'spray') { sprayInterval = setInterval(() => spray(p), 30); } else { ctx.fillStyle = currentColor; ctx.beginPath(); ctx.arc(p.x, p.y, brushSize / 2, 0, Math.PI * 2); ctx.fill(); } }
        function draw(e) { if (!isDrawing || currentTool === 'spray') return; const p = getPos(e); ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(p.x, p.y); ctx.strokeStyle = currentColor; ctx.lineWidth = brushSize; ctx.globalAlpha = currentTool === 'marker' ? 0.6 : 1; if (currentTool === 'marker') ctx.lineWidth = brushSize * 2.5; ctx.stroke(); ctx.globalAlpha = 1; lastX = p.x; lastY = p.y; }
        function spray(p) { for (let i = 0; i < brushSize * 2; i++) { const ox = (Math.random() - 0.5) * brushSize * 5, oy = (Math.random() - 0.5) * brushSize * 5; if (Math.sqrt(ox * ox + oy * oy) < brushSize * 2.5) { ctx.fillStyle = currentColor; ctx.globalAlpha = Math.random() * 0.5 + 0.3; ctx.beginPath(); ctx.arc(p.x + ox, p.y + oy, Math.random() * 2 + 0.5, 0, Math.PI * 2); ctx.fill(); } } ctx.globalAlpha = 1; }
        function stopDraw() { if (!isDrawing) return; isDrawing = false; if (sprayInterval) { clearInterval(sprayInterval); sprayInterval = null; } saveCanvas(); recordActivity(); }

        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDraw);
        canvas.addEventListener('mouseleave', stopDraw);
        canvas.addEventListener('touchstart', e => { e.preventDefault(); startDraw({ clientX: e.touches[0].clientX, clientY: e.touches[0].clientY }); }, { passive: false });
        canvas.addEventListener('touchmove', e => { e.preventDefault(); if (currentTool === 'spray') { const r = canvas.getBoundingClientRect(); lastX = (e.touches[0].clientX - r.left) * (canvas.width / r.width); lastY = (e.touches[0].clientY - r.top) * (canvas.height / r.height); } else draw({ clientX: e.touches[0].clientX, clientY: e.touches[0].clientY }); }, { passive: false });
        canvas.addEventListener('touchend', e => { e.preventDefault(); stopDraw(); }, { passive: false });

        document.querySelectorAll('.color-dot').forEach(d => d.addEventListener('click', function() { currentColor = this.dataset.color; document.querySelectorAll('.color-dot').forEach(x => x.classList.remove('active')); this.classList.add('active'); }));
        function clearWallpaper() { ctx.clearRect(0, 0, canvas.width, canvas.height); if (roomId) database.ref('rooms/' + roomId + '/canvas').set({ imageData: null, action: 'clear', timestamp: Date.now() }); showToast("🗑 Cleared"); }
        window.clearWallpaper = clearWallpaper;
        function saveCanvas() { if (!roomId) return; database.ref('rooms/' + roomId + '/canvas').set({ imageData: canvas.toDataURL('image/png'), timestamp: Date.now() }); }
        function loadCanvas() { if (!roomId) return; database.ref('rooms/' + roomId + '/canvas').once('value').then(s => { const d = s.val(); if (d && d.imageData && d.action !== 'clear') { const img = new Image(); img.onload = () => { ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.drawImage(img, 0, 0, canvas.width, canvas.height); }; img.src = d.imageData; } }); }
        function startListening() { database.ref('rooms/' + roomId + '/canvas').on('value', s => { const d = s.val(); if (!d || isDrawing) return; if (d.timestamp && d.timestamp > lastTimestamp) { lastTimestamp = d.timestamp; if (d.action === 'clear') { ctx.clearRect(0, 0, canvas.width, canvas.height); showToast("🗑 Partner cleared"); } else if (d.imageData) { const img = new Image(); img.onload = () => { ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.drawImage(img, 0, 0, canvas.width, canvas.height); }; img.src = d.imageData; } } }); }

        // Heart
        function sendHeart() { if (!roomId) return; database.ref('rooms/' + roomId + '/heart').set({ timestamp: Date.now(), from: currentUser.displayName }); spawnHeart(); showToast("❤️ Heart sent!"); }
        window.sendHeart = sendHeart;
        function spawnHeart() { const h = document.createElement('div'); h.className = 'floating-heart'; h.textContent = '❤️'; h.style.left = Math.random() * 70 + 15 + '%'; h.style.top = '60%'; document.body.appendChild(h); setTimeout(() => h.remove(), 2000); }
        function startHeartListener() { database.ref('rooms/' + roomId + '/heart').on('value', s => { const d = s.val(); if (d && d.timestamp > lastHeartTimestamp) { lastHeartTimestamp = d.timestamp; spawnHeart(); showToast(`❤️ Heart from ${d.from}`); } }); }

        // Streak
        function recordActivity() { if (!roomId) return; const today = new Date().toDateString(); database.ref('rooms/' + roomId + '/activity/' + currentUser.uid).set({ date: today, timestamp: Date.now() }); }
        function updateStreak() { database.ref('rooms/' + roomId + '/activity').on('value', s => { const data = s.val(); if (!data) return; const dates = Object.values(data).map(d => d.date).filter((v, i, a) => a.indexOf(v) === i).sort().reverse(); let streak = 0; const today = new Date(); today.setHours(0, 0, 0, 0); for (let i = 0; i < dates.length; i++) { const d = new Date(dates[i]); d.setHours(0, 0, 0, 0); const expected = new Date(today); expected.setDate(expected.getDate() - i); if (d.getTime() === expected.getTime()) streak++; else break; } const badge = document.getElementById('streak-badge'); if (streak > 0) { badge.classList.add('show'); document.getElementById('streak-count').textContent = streak; } else badge.classList.remove('show'); }); }

        // Share
        function shareDrawing() { document.getElementById('share-image').src = canvas.toDataURL('image/png'); document.getElementById('share-panel').classList.add('show'); document.getElementById('share-overlay').classList.add('show'); }
        window.shareDrawing = shareDrawing;
        function closeShare() { document.getElementById('share-panel').classList.remove('show'); document.getElementById('share-overlay').classList.remove('show'); }
        window.closeShare = closeShare;
        function downloadImage() { const link = document.createElement('a'); link.download = 'link-drawing.png'; link.href = canvas.toDataURL('image/png'); link.click(); showToast("✅ Saved!"); }
        window.downloadImage = downloadImage;

        // Chat
        function toggleChat() { if (chatOpen) { closeChat(); } else { chatOpen = true; document.getElementById('chat-panel').classList.add('show'); document.getElementById('chat-overlay').classList.add('show'); unreadMessages = 0; updateChatBadge(); document.getElementById('chat-input').focus(); } }
        window.toggleChat = toggleChat;
        function closeChat() { chatOpen = false; document.getElementById('chat-panel').classList.remove('show'); document.getElementById('chat-overlay').classList.remove('show'); }
        window.closeChat = closeChat;
        function sendMessage() { const input = document.getElementById('chat-input'); const msg = input.value.trim(); if (!msg || !roomId) return; database.ref('rooms/' + roomId + '/messages').push({ text: msg, from: currentUser.uid, fromName: currentUser.displayName, timestamp: Date.now(), type: 'text' }); input.value = ''; }
        window.sendMessage = sendMessage;
        function sendMedia(input) { const file = input.files[0]; if (!file || !roomId) return; if (file.size > 5 * 1024 * 1024) { showToast("Too large (max 5MB)"); return; } const reader = new FileReader(); reader.onload = function(e) { database.ref('rooms/' + roomId + '/messages').push({ imageUrl: e.target.result, from: currentUser.uid, fromName: currentUser.displayName, timestamp: Date.now(), type: 'image' }); }; reader.readAsDataURL(file); input.value = ''; }
        window.sendMedia = sendMedia;

        // Voice Recording
        async function startRecording() {
            if (!roomId) return;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const blob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        database.ref('rooms/' + roomId + '/messages').push({ audioUrl: e.target.result, duration: Math.round(audioChunks.length * 0.1), from: currentUser.uid, fromName: currentUser.displayName, timestamp: Date.now(), type: 'voice' });
                    };
                    reader.readAsDataURL(blob);
                    stream.getTracks().forEach(t => t.stop());
                };
                mediaRecorder.start();
                isRecording = true;
                document.getElementById('voice-record-btn').classList.add('recording');
                showToast("🔴 Recording...");
            } catch (e) { showToast("Microphone access denied"); }
        }
        window.startRecording = startRecording;
        function stopRecording() { if (mediaRecorder && isRecording) { mediaRecorder.stop(); isRecording = false; document.getElementById('voice-record-btn').classList.remove('recording'); showToast("✅ Voice sent"); } }
        window.stopRecording = stopRecording;

        function startChatListener() {
            database.ref('rooms/' + roomId + '/messages').limitToLast(50).on('child_added', s => {
                const d = s.val(); addChatMessage(d, s.key);
                if (!chatOpen && d.from !== currentUser.uid) { unreadMessages++; updateChatBadge(); }
            });
        }
        function addChatMessage(d, key) {
            const container = document.getElementById('chat-messages');
            if (document.getElementById('msg-' + key)) return;
            const div = document.createElement('div'); div.id = 'msg-' + key;
            div.className = 'chat-msg ' + (d.from === currentUser.uid ? 'sent' : 'received');
            if (d.type === 'image') { div.innerHTML = `<img src="${d.imageUrl}" alt="Photo"><div class="chat-time">${new Date(d.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>`; }
            else if (d.type === 'voice') { div.innerHTML = `<div class="voice-msg" onclick="playVoice('${d.audioUrl}', this)"><button class="play-pause">▶</button><div class="waveform"><div class="progress" style="width:0%"></div></div><span class="duration">0:${String(d.duration || 3).padStart(2, '0')}</span></div><div class="chat-time">${new Date(d.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>`; }
            else { div.innerHTML = `${d.text}<div class="chat-time">${new Date(d.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>`; }
            container.appendChild(div); container.scrollTop = container.scrollHeight;
        }
        function updateChatBadge() { const b = document.getElementById('chat-badge'); if (unreadMessages > 0) { b.classList.add('show'); } else b.classList.remove('show'); }

        let currentVoiceAudio = null;
        function playVoice(url, el) {
            if (currentVoiceAudio) { currentVoiceAudio.pause(); currentVoiceAudio = null; }
            const audio = new Audio(url);
            currentVoiceAudio = audio;
            const btn = el.querySelector('.play-pause');
            const progress = el.querySelector('.progress');
            btn.textContent = '⏸';
            audio.play();
            audio.ontimeupdate = () => { if (audio.duration) progress.style.width = (audio.currentTime / audio.duration) * 100 + '%'; };
            audio.onended = () => { btn.textContent = '▶'; progress.style.width = '0%'; currentVoiceAudio = null; };
            btn.onclick = (e) => { e.stopPropagation(); if (audio.paused) { audio.play(); btn.textContent = '⏸'; } else { audio.pause(); btn.textContent = '▶'; } };
        }
        window.playVoice = playVoice;

        // Music Sync
        function toggleMusic() { musicBarOpen = !musicBarOpen; document.getElementById('music-bar').classList.toggle('show', musicBarOpen); }
        window.toggleMusic = toggleMusic;
        function syncMusic() {
            const link = document.getElementById('youtube-link').value.trim();
            if (!link || !roomId) return;
            const videoId = extractYoutubeId(link);
            if (!videoId) { showToast("Invalid YouTube link"); return; }
            database.ref('rooms/' + roomId + '/music').set({ videoId, timestamp: Date.now(), action: 'play', from: currentUser.displayName });
            showToast("🎵 Music synced!");
        }
        window.syncMusic = syncMusic;
        function stopMusic() { if (!roomId) return; database.ref('rooms/' + roomId + '/music').set({ action: 'stop', timestamp: Date.now() }); if (musicPlayer) { musicPlayer.stopVideo(); } showToast("⏹ Stopped"); }
        window.stopMusic = stopMusic;
        function extractYoutubeId(url) { const match = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/); return match ? match[1] : null; }

        function startMusicListener() {
            const tag = document.createElement('script'); tag.src = "https://www.youtube.com/iframe_api"; document.body.appendChild(tag);
            window.onYouTubeIframeAPIReady = () => {
                musicPlayer = new YT.Player('music-player-frame', { height: '0', width: '0', events: { onReady: () => {} } });
            };
            const frame = document.createElement('div'); frame.id = 'music-player-frame'; frame.style.display = 'none'; document.body.appendChild(frame);
            database.ref('rooms/' + roomId + '/music').on('value', s => {
                const d = s.val(); if (!d) return;
                if (d.action === 'stop') { if (musicPlayer && musicPlayer.stopVideo) musicPlayer.stopVideo(); showToast("⏹ Music stopped"); }
                else if (d.action === 'play' && d.videoId) {
                    if (musicPlayer && musicPlayer.loadVideoById) { musicPlayer.loadVideoById(d.videoId); musicPlayer.playVideo(); showToast(`🎵 Playing: ${d.from}`); }
                }
            });
        }

        console.log("✅ Link with Voice + Music ready");
    </script>
</body>
</html>
