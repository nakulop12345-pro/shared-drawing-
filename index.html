<!DOCTYPE html>
<html>
<head>
    <title>Shared Wallpaper - MyOS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        body {
            background: #0a0a0a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        /* Login Screen */
        #login-screen {
            text-align: center;
            color: white;
            padding: 30px;
        }
        #login-screen h2 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        #login-screen p {
            color: rgba(255,255,255,0.5);
            margin-bottom: 25px;
            font-size: 14px;
        }
        #login-screen input {
            padding: 16px 25px;
            font-size: 18px;
            border-radius: 15px;
            border: 2px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.08);
            color: white;
            text-align: center;
            margin: 10px;
            outline: none;
            width: 250px;
            transition: border 0.3s;
        }
        #login-screen input:focus {
            border-color: #4f46e5;
        }
        #login-screen button {
            padding: 16px 50px;
            font-size: 18px;
            border-radius: 15px;
            border: none;
            background: #4f46e5;
            color: white;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            transition: background 0.2s;
        }
        #login-screen button:active {
            background: #3730a3;
        }
        #login-error {
            color: #ff6b6b;
            margin-top: 15px;
            font-size: 13px;
            min-height: 20px;
        }

        /* Wallpaper Screen */
        #wallpaper-screen {
            display: none;
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
            touch-action: none;
        }
        
        /* Color Picker */
        #color-picker {
            position: fixed;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            background: rgba(20,20,20,0.85);
            padding: 12px 18px;
            border-radius: 50px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 100;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .color-dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.2s;
        }
        .color-dot:active {
            transform: scale(1.3);
        }
        .color-dot.active {
            border-color: white;
            transform: scale(1.15);
            box-shadow: 0 0 15px rgba(255,255,255,0.3);
        }

        /* Top buttons */
        #clear-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: rgba(20,20,20,0.8);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 100;
        }
        #clear-btn:active {
            background: rgba(255,80,80,0.5);
        }
        #partner-indicator {
            position: fixed;
            top: 20px;
            left: 20px;
            color: rgba(255,255,255,0.85);
            font-size: 13px;
            background: rgba(20,20,20,0.8);
            padding: 10px 16px;
            border-radius: 25px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 100;
            border: 1px solid rgba(255,255,255,0.1);
        }
        #status {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 11px;
            background: rgba(0,0,0,0.7);
            padding: 6px 14px;
            border-radius: 20px;
            z-index: 100;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Login Screen -->
    <div id="login-screen">
        <h2>🔐 Shared Wallpaper</h2>
        <p>Enter the same room code on both devices</p>
        <input type="text" id="room-input" placeholder="e.g. sunset-42" maxlength="30" autocomplete="off">
        <br>
        <button id="enter-btn">Enter Room</button>
        <p id="login-error"></p>
    </div>

    <!-- Wallpaper Screen -->
    <div id="wallpaper-screen">
        <canvas id="wallpaper"></canvas>
        <div id="partner-indicator">👤 Just you</div>
        <div id="status">🟢 Ready</div>
        <button id="clear-btn">🗑 Clear</button>
        <div id="color-picker">
            <div class="color-dot active" style="background:#ffffff;" data-color="#ffffff"></div>
            <div class="color-dot" style="background:#ff6b6b;" data-color="#ff6b6b"></div>
            <div class="color-dot" style="background:#ffd93d;" data-color="#ffd93d"></div>
            <div class="color-dot" style="background:#6bcb77;" data-color="#6bcb77"></div>
            <div class="color-dot" style="background:#4d96ff;" data-color="#4d96ff"></div>
            <div class="color-dot" style="background:#ff6eb4;" data-color="#ff6eb4"></div>
            <div class="color-dot" style="background:#c084fc;" data-color="#c084fc"></div>
        </div>
    </div>

    <script>
        (function() {
            // ============================================
            // CONFIG
            // ============================================
            const FIREBASE_URL = "https://myos-8e487-default-rtdb.asia-southeast1.firebasedatabase.app";
            
            // ============================================
            // STATE
            // ============================================
            let roomCode = "";
            let currentColor = "#ffffff";
            let isDrawing = false;
            let canvas, ctx;
            let lastX = 0, lastY = 0;
            let isReceiving = false; // Prevent loops when receiving data
            
            console.log("🚀 Shared Wallpaper starting...");

            // ============================================
            // DOM ELEMENTS
            // ============================================
            const loginScreen = document.getElementById('login-screen');
            const wallpaperScreen = document.getElementById('wallpaper-screen');
            const roomInput = document.getElementById('room-input');
            const enterBtn = document.getElementById('enter-btn');
            const loginError = document.getElementById('login-error');
            const partnerIndicator = document.getElementById('partner-indicator');
            const statusEl = document.getElementById('status');
            const clearBtn = document.getElementById('clear-btn');
            
            canvas = document.getElementById('wallpaper');
            ctx = canvas.getContext('2d');
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = 3;

            // ============================================
            // CANVAS SETUP
            // ============================================
            function resizeCanvas() {
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                ctx.putImageData(imageData, 0, 0);
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.lineWidth = 3;
            }
            
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            // ============================================
            // JOIN ROOM
            // ============================================
            function joinRoom() {
                const code = roomInput.value.trim();
                
                if (!code) {
                    loginError.textContent = "Please enter a room code";
                    return;
                }
                
                if (code.length < 3) {
                    loginError.textContent = "Room code must be at least 3 characters";
                    return;
                }
                
                roomCode = code;
                loginScreen.style.display = 'none';
                wallpaperScreen.style.display = 'block';
                loginError.textContent = "";
                
                resizeCanvas();
                
                partnerIndicator.textContent = "👤 Room: " + roomCode;
                statusEl.textContent = "🟡 Loading...";
                
                // Load any existing drawing
                loadCanvas();
                
                // Start listening for partner
                startListening();
                
                console.log("✅ Joined room:", roomCode);
            }

            // ============================================
            // GET CORRECTED POSITION
            // ============================================
            function getPos(e) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                return {
                    x: (e.clientX - rect.left) * scaleX,
                    y: (e.clientY - rect.top) * scaleY
                };
            }

            // ============================================
            // DRAWING
            // ============================================
            function startDraw(e) {
                isDrawing = true;
                const pos = getPos(e);
                lastX = pos.x;
                lastY = pos.y;
                
                // Draw a dot where they clicked
                ctx.fillStyle = currentColor;
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, 1.5, 0, Math.PI * 2);
                ctx.fill();
            }

            function draw(e) {
                if (!isDrawing) return;
                
                const pos = getPos(e);
                
                // Draw line segment locally
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(pos.x, pos.y);
                ctx.strokeStyle = currentColor;
                ctx.stroke();
                
                lastX = pos.x;
                lastY = pos.y;
            }

            function stopDraw() {
                if (!isDrawing) return;
                isDrawing = false;
                
                // Save entire canvas to Firebase
                saveCanvas();
                
                statusEl.textContent = "🟢 Saved";
                setTimeout(() => {
                    statusEl.textContent = "🟢 Ready";
                }, 800);
            }

            // Mouse events
            canvas.addEventListener('mousedown', startDraw);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDraw);
            canvas.addEventListener('mouseleave', stopDraw);

            // Touch events
            canvas.addEventListener('touchstart', function(e) {
                e.preventDefault();
                const touch = e.touches[0];
                startDraw({ clientX: touch.clientX, clientY: touch.clientY });
            }, { passive: false });

            canvas.addEventListener('touchmove', function(e) {
                e.preventDefault();
                const touch = e.touches[0];
                draw({ clientX: touch.clientX, clientY: touch.clientY });
            }, { passive: false });

            canvas.addEventListener('touchend', function(e) {
                e.preventDefault();
                stopDraw();
            }, { passive: false });

            // ============================================
            // COLOR PICKER
            // ============================================
            document.querySelectorAll('.color-dot').forEach(dot => {
                dot.addEventListener('click', function() {
                    currentColor = this.dataset.color;
                    document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
                    this.classList.add('active');
                });
            });

            // ============================================
            // CLEAR
            // ============================================
            clearBtn.addEventListener('click', function() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                if (roomCode) {
                    fetch(`${FIREBASE_URL}/rooms/${roomCode}/canvas.json`, {
                        method: 'PUT',
                        body: JSON.stringify({ 
                            imageData: null, 
                            action: 'clear',
                            timestamp: Date.now() 
                        })
                    });
                }
                statusEl.textContent = "🗑 Cleared";
                setTimeout(() => {
                    statusEl.textContent = "🟢 Ready";
                }, 1000);
            });

            // ============================================
            // SAVE CANVAS TO FIREBASE
            // ============================================
            function saveCanvas() {
                if (!roomCode) return;
                
                const imageData = canvas.toDataURL('image/png');
                const url = `${FIREBASE_URL}/rooms/${roomCode}/canvas.json`;
                
                fetch(url, {
                    method: 'PUT',
                    body: JSON.stringify({ 
                        imageData: imageData,
                        timestamp: Date.now() 
                    })
                }).catch(err => {
                    console.error("Save error:", err);
                });
            }

            // ============================================
            // LOAD CANVAS FROM FIREBASE
            // ============================================
            async function loadCanvas() {
                if (!roomCode) return;
                
                const url = `${FIREBASE_URL}/rooms/${roomCode}/canvas.json`;
                
                try {
                    const response = await fetch(url);
                    const data = await response.json();
                    
                    if (data && data.imageData && data.action !== 'clear') {
                        isReceiving = true;
                        const img = new Image();
                        img.onload = function() {
                            ctx.clearRect(0, 0, canvas.width, canvas.height);
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                            statusEl.textContent = "🟢 Canvas loaded";
                            setTimeout(() => {
                                statusEl.textContent = "🟢 Ready";
                            }, 1000);
                            isReceiving = false;
                        };
                        img.src = data.imageData;
                    } else {
                        statusEl.textContent = "🟢 Fresh canvas";
                        setTimeout(() => {
                            statusEl.textContent = "🟢 Ready";
                        }, 1000);
                    }
                } catch (err) {
                    statusEl.textContent = "🟢 Ready";
                }
            }

            // ============================================
            // LISTEN FOR PARTNER UPDATES
            // ============================================
            let lastTimestamp = 0;

            function startListening() {
                setInterval(async () => {
                    if (!roomCode || isDrawing) return; // Don't update while local user is drawing
                    
                    const url = `${FIREBASE_URL}/rooms/${roomCode}/canvas.json`;
                    
                    try {
                        const response = await fetch(url);
                        const data = await response.json();
                        
                        if (data && data.timestamp && data.timestamp > lastTimestamp) {
                            lastTimestamp = data.timestamp;
                            
                            if (data.action === 'clear') {
                                ctx.clearRect(0, 0, canvas.width, canvas.height);
                                partnerIndicator.textContent = "🗑 Partner cleared";
                                setTimeout(() => {
                                    partnerIndicator.textContent = "👤 Room: " + roomCode;
                                }, 2000);
                            } else if (data.imageData) {
                                isReceiving = true;
                                const img = new Image();
                                img.onload = function() {
                                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                                    partnerIndicator.textContent = "✏️ Partner updated";
                                    statusEl.textContent = "🟢 Synced";
                                    setTimeout(() => {
                                        partnerIndicator.textContent = "👤 Room: " + roomCode;
                                        statusEl.textContent = "🟢 Ready";
                                    }, 1500);
                                    isReceiving = false;
                                };
                                img.src = data.imageData;
                            }
                        }
                    } catch (err) {
                        // Silently retry on next interval
                    }
                }, 500); // Check every 500ms
            }

            // ============================================
            // ENTER BUTTON & KEYBOARD
            // ============================================
            enterBtn.addEventListener('click', joinRoom);
            
            roomInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    joinRoom();
                }
            });

            console.log("✅ Shared Wallpaper ready");
        })();
    </script>
</body>
</html>
