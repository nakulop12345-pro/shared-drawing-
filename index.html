<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NR">
    <meta name="theme-color" content="#1a0a0f">
    <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIk5SIiwKICAic2hvcnRfbmFtZSI6ICJOUiIsCiAgInN0YXJ0X3VybCI6ICIuIiwKICAiZGlzcGxheSI6ICJzdGFuZGFsb25lIiwKICAiYmFja2dyb3VuZF9jb2xvciI6ICIjMWEwYTBmIiwKICAidGhlbWVfY29sb3IiOiAiIzFhMGEwZiIsCiAgImljb25zIjogW3sic3JjIjoiZGF0YTppbWFnZS9zdmcreG1sO2Jhc2U2NCxQSE4yWnlCNGJXeHVjejBpYUhSMGNEb3ZMM2QzZHk1M015NXZjbWN2TWpBd01DOXpkbWNpSUhacFpYZENiM2c5SWpBdU1TSWdhR1ZwWjJoMFBTSXhMak1pTHo0S1BITjBlV3hsUG1GdWJtbHVaM0psWVhScGIyNCtDaUFnSUNBZ0lDQWdJQ0FnSUNBZ0lDQWdJQ0FnSUNBZ0lDQWdJQ0FnSUNBZ0lDQWdJQ0FnSUNBZ0lDQThMM04wZVd4bFBtTnNhV1Z1ZEY5c2FXNWxQV1poYkhObEx6NEsiLCJzaXplcyI6IjUxMng1MTIiLCJ0eXBlIjoiaW1hZ2UvcG5nIiwicHVycG9zZSI6ImFueSJ9XX0=">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#1a0a0f;--surface:rgba(30,12,20,0.85);--surface2:rgba(40,15,25,0.9);--border:rgba(255,192,203,0.06);--border2:rgba(255,192,203,0.12);--text:#f5e8ec;--text2:#c0a0a8;--text3:#805060;--accent:#ffb6c1;--accent2:#ffc0cb;--accent-dark:#e8929f;--glow:rgba(255,182,193,0.2);--neon:#ff69b4;--danger:#ff4474;--success:#7bed9f;--warning:#ffa502;--info:#70a1ff;--radius:16px;--radius-sm:12px;--radius-xs:8px}
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#000;font-family:'Inter',-apple-system,sans-serif;height:100dvh;overflow:hidden;-webkit-tap-highlight-color:transparent;color:var(--text);display:flex;justify-content:center}
        .app{width:100%;max-width:500px;height:100dvh;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
        @media(min-width:501px){.app{border-left:1px solid var(--border2);border-right:1px solid var(--border2)}}
        .header{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;background:transparent;z-index:10;min-height:54px}
        .header h1{font-size:20px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--neon));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .avatar-btn{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--neon));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#1a0a0f;cursor:pointer;border:none;box-shadow:0 0 20px var(--glow);flex-shrink:0}
        .back-btn{width:34px;height:34px;border-radius:50%;background:var(--surface2);border:1px solid var(--border2);color:var(--text2);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
        .screen{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;background:var(--bg);transition:transform .3s ease,opacity .3s ease}
        .screen.hidden{opacity:0;pointer-events:none;transform:scale(0.96)}
        #login-screen{align-items:center;justify-content:center;padding:40px;text-align:center;gap:24px}
        #login-screen h2{font-size:24px;font-weight:800;color:var(--accent)}#login-screen p{color:var(--text2);font-size:13px}
        .btn-google{padding:13px 22px;border-radius:var(--radius-sm);border:2px solid var(--accent);background:transparent;color:var(--accent);font-weight:600;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:10px;font-family:'Inter',sans-serif}
        .btn-google:active{background:var(--accent);color:#1a0a0f}.btn-google svg{width:20px;height:20px}
        .main-content{flex:1;overflow-y:auto;padding:0 14px 10px}
        .greeting{padding:4px 0 14px}.greeting .time{font-size:12px;color:var(--text2)}.greeting .name{font-size:20px;font-weight:800;color:var(--text)}
        .section-header{display:flex;justify-content:space-between;align-items:center;padding:6px 4px;margin-top:8px}
        .section-header h3{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text3);font-weight:600}
        .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
        .stat-card{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);padding:14px;text-align:center;cursor:pointer;transition:all .15s;backdrop-filter:blur(20px)}
        .stat-card:active{background:var(--surface2);transform:scale(0.97)}.stat-card .stat-num{font-size:22px;font-weight:800;color:var(--accent)}.stat-card .stat-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-top:2px}
        .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px 14px;margin-bottom:6px;display:flex;align-items:center;gap:12px;transition:all .15s;backdrop-filter:blur(20px);cursor:pointer}
        .card:active{background:var(--surface2)}.card .icon{width:38px;height:38px;border-radius:var(--radius-xs);display:flex;align-items:center;justify-content:center;flex-shrink:0;background:rgba(255,182,193,0.1);color:var(--accent)}
        .card .icon svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}.card .info{flex:1;min-width:0}.card .title{font-size:13px;font-weight:600}.card .sub{font-size:11px;color:var(--text3)}
        .empty-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;text-align:center;color:var(--text3);font-size:12px}

        #player-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;background:var(--surface2);border-top:1px solid var(--border2);z-index:30;backdrop-filter:blur(30px);display:none}
        #player-bar.show{display:block}
        #player-embed{width:100%;height:80px;border:none;border-radius:0}
        .player-info{padding:8px 14px;display:flex;align-items:center;gap:10px}
        .player-info .song-title{font-size:13px;font-weight:600;flex:1}.player-info .song-source{font-size:10px;color:var(--text3);text-transform:uppercase}

        .room-chat{position:fixed;bottom:140px;left:50%;transform:translateX(-50%);width:100%;max-width:500px;background:var(--surface2);border-top:1px solid var(--border2);padding:8px 12px;display:none;gap:8px;z-index:29}
        .room-chat.show{display:flex}.room-chat input{flex:1;padding:8px 12px;border-radius:20px;border:1px solid var(--border2);background:var(--bg);color:var(--text);font-size:12px;outline:none;font-family:'Inter',sans-serif}
        .room-chat button{background:var(--accent);color:#1a0a0f;border:none;padding:8px 14px;border-radius:20px;font-weight:600;cursor:pointer;font-size:11px}

        .modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:50;justify-content:flex-end;align-items:flex-end}
        .modal-overlay.on{display:flex}
        .modal-sheet{background:var(--surface2);border-radius:var(--radius) var(--radius) 0 0;padding:20px 18px 30px;width:100%;max-width:500px;max-height:80vh;overflow-y:auto;border:1px solid var(--border2);border-bottom:none;backdrop-filter:blur(30px);animation:slideUp .3s ease}
        @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
        .modal-sheet h2{font-size:17px;font-weight:700;color:var(--accent);margin-bottom:4px}.modal-sheet .subtitle{font-size:11px;color:var(--text3);margin-bottom:14px}
        .modal-sheet input,.modal-sheet select{width:100%;padding:11px 13px;border-radius:var(--radius-xs);border:1.5px solid var(--border2);background:var(--bg);color:var(--text);font-size:13px;outline:none;font-family:'Inter',sans-serif;margin-bottom:8px}
        .modal-sheet input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
        .btn-row{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
        .btn{padding:10px 20px;border-radius:var(--radius-xs);border:none;font-weight:600;cursor:pointer;font-size:12px;font-family:'Inter',sans-serif}.btn:active{transform:scale(.95)}
        .btn-primary{background:var(--accent);color:#1a0a0f}.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border2)}

        .install-bar{display:none;padding:10px 14px;background:var(--surface2);border-top:1px solid var(--border2);align-items:center;gap:10px;position:fixed;bottom:100px;left:50%;transform:translateX(-50%);width:100%;max-width:500px;z-index:28}
        .install-bar.show{display:flex}.install-bar span{flex:1;font-size:12px;color:var(--text2)}.install-bar button{background:var(--accent);color:#1a0a0f;border:none;padding:8px 16px;border-radius:20px;font-weight:600;font-size:11px;cursor:pointer}
        .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--surface2);color:var(--text);font-size:12px;padding:10px 22px;border-radius:50px;z-index:100;opacity:0;transition:all .3s;pointer-events:none;border:1px solid var(--border2)}
        .toast.show{opacity:1}::-webkit-scrollbar{width:0}
    </style>
</head>
<body>
<div class="app">
    <div class="screen" id="login-screen">
        <div style="width:70px;height:70px;border-radius:20px;background:linear-gradient(135deg,var(--accent),var(--neon));display:flex;align-items:center;justify-content:center;box-shadow:0 0 50px var(--glow)">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#1a0a0f" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </div>
        <h2>Welcome to NR</h2>
        <p>Spotify • SoundCloud • MP3. Sync with friends.</p>
        <button class="btn-google" onclick="signIn()">
            <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
            Sign in with Google
        </button>
    </div>

    <div class="screen hidden" id="home-screen">
        <div class="header"><h1>NR</h1><button class="avatar-btn" id="login-btn" onclick="signOut()">?</button></div>
        <div class="main-content">
            <div class="greeting"><div class="time" id="time-greet">Good Morning</div><div class="name" id="user-name">User</div></div>
            <div class="stat-grid">
                <div class="stat-card" onclick="openPage('playlists')"><div class="stat-num" id="home-playlists">0</div><div class="stat-label">Playlists</div></div>
                <div class="stat-card" onclick="openPage('friends')"><div class="stat-num" id="home-friends">0</div><div class="stat-label">Friends</div></div>
                <div class="stat-card" onclick="openPage('rooms')"><div class="stat-num" id="home-rooms">0</div><div class="stat-label">Rooms</div></div>
                <div class="stat-card" onclick="openAddMusic()"><div style="font-size:28px">+</div><div class="stat-label">Add Music</div></div>
            </div>
            <div class="section-header"><h3>Now Playing</h3></div><div id="now-playing-card"><div class="empty-card">No music</div></div>
            <div class="section-header"><h3>Queue</h3></div><div id="home-queue"><div class="empty-card">Empty</div></div>
            <div style="height:120px"></div>
        </div>
    </div>

    <div class="screen hidden" id="page-screen">
        <div class="header"><button class="back-btn" onclick="goHome()">←</button><h1 id="page-title">Page</h1><button class="avatar-btn" id="page-add">+</button></div>
        <div class="main-content" id="page-content"></div>
    </div>

    <div class="screen hidden" id="room-screen">
        <div class="header"><button class="back-btn" onclick="leaveRoom()">←</button><h1 id="room-title">Room</h1><button class="avatar-btn" id="room-host-btn">Host</button></div>
        <div class="main-content" id="room-content"></div>
        <div class="room-chat" id="room-chat"><input id="chat-inp" placeholder="Chat..." onkeypress="if(event.key==='Enter')sendChat()"><button onclick="sendChat()">Send</button></div>
    </div>

    <div id="player-bar"><iframe id="player-embed" allow="autoplay; encrypted-media" allowfullscreen></iframe><div class="player-info"><span class="song-title" id="player-title">No track</span><span class="song-source" id="player-source"></span></div></div>
    <div class="install-bar" id="install-bar"><span>Install NR</span><button onclick="installApp()">Install</button></div>
    <div class="modal-overlay" id="modal"><div class="modal-sheet" id="modal-content"></div></div>
    <div class="toast" id="toast"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://w.soundcloud.com/player/api.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyAr_Fcr_IbMl9syK4zxep3ar9OEHHBppT8",authDomain:"myos-8e487.firebaseapp.com",databaseURL:"https://myos-8e487-default-rtdb.asia-southeast1.firebasedatabase.app"});
const auth=firebase.auth(),db=firebase.database();const $=id=>document.getElementById(id);
let me=null,uname='User',queue=[],queueIndex=-1,currentRoom=null,isHost=false,deferredPrompt=null,scWidget=null;

function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2000)}
$('time-greet').textContent=new Date().getHours()<12?'Good Morning':new Date().getHours()<17?'Good Afternoon':'Good Evening';
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('install-bar').classList.add('show')});
window.installApp=()=>{if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(()=>{deferredPrompt=null;$('install-bar').classList.remove('show')})}};
window.signIn=()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
window.signOut=()=>auth.signOut();
auth.onAuthStateChanged(u=>{if(u){me=u;uname=u.displayName||'User';$('user-name').textContent=uname;$('login-btn').textContent=uname[0].toUpperCase();$('login-screen').classList.add('hidden');$('home-screen').classList.remove('hidden');loadHome()}else{me=null;$('login-screen').classList.remove('hidden');$('home-screen').classList.add('hidden');$('page-screen').classList.add('hidden');$('room-screen').classList.add('hidden')}});
function esc(s){return(s||'').replace(/'/g,"\\'").replace(/"/g,'&quot;')}
function loadHome(){if(!me)return;db.ref('users/'+me.uid+'/playlists').once('value').then(s=>$('home-playlists').textContent=s.numChildren());db.ref('users/'+me.uid+'/friends').once('value').then(s=>$('home-friends').textContent=s.numChildren());db.ref('rooms').once('value').then(s=>$('home-rooms').textContent=s.numChildren());updateQueueUI()}
function updateQueueUI(){if(queue.length===0){$('home-queue').innerHTML='<div class="empty-card">Empty</div>';return}$('home-queue').innerHTML=queue.map((s,i)=>`<div class="card" onclick="playFromQueue(${i})"><div class="icon"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3" fill="currentColor"/></svg></div><div class="info"><div class="title">${esc(s.title)}</div><div class="sub">${i===queueIndex?'▶ Now':'Queued'} — ${s.source}</div></div></div>`).join('')}

// Add Music with Playlist
window.openAddMusic=function(){
    const mc=$('modal-content');
    db.ref('users/'+me.uid+'/playlists').once('value').then(s=>{
        let popts='<option value="">Save to library only</option>';
        s.forEach(c=>popts+=`<option value="${c.key}">${esc(c.val().name)}</option>`);
        mc.innerHTML=`<h2>Add Music</h2><p class="subtitle">Choose source and playlist</p>
        <select id="add-source" onchange="showAddForm(this.value)"><option value="">Select source...</option><option value="spotify">Spotify</option><option value="soundcloud">SoundCloud</option><option value="upload">Upload MP3</option></select>
        <select id="add-playlist" style="margin-top:8px">${popts}</select><p style="font-size:10px;color:var(--text3)">Select playlist to add this song to</p>
        <div id="add-form-area"></div>`;
        $('modal').classList.add('on');
    });
};
window.showAddForm=function(src){
    const area=$('add-form-area');if(!src){area.innerHTML='';return}
    if(src==='spotify')area.innerHTML=`<input id="af1" placeholder="Spotify URL"><input id="af2" placeholder="Track name"><button class="btn btn-primary" style="width:100%;margin-top:4px" onclick="addWithPlaylist('spotify')">Add Spotify Track</button>`;
    else if(src==='soundcloud')area.innerHTML=`<input id="af1" placeholder="SoundCloud URL"><input id="af2" placeholder="Track name"><button class="btn btn-primary" style="width:100%;margin-top:4px" onclick="addWithPlaylist('soundcloud')">Add SoundCloud Track</button>`;
    else if(src==='upload')area.innerHTML=`<input id="af1" placeholder="Song title"><input type="file" id="af2" accept="audio/*"><button class="btn btn-primary" style="width:100%;margin-top:4px" onclick="addWithPlaylist('upload')">Upload & Add</button>`;
};
window.addWithPlaylist=function(src){
    const pid=document.getElementById('add-playlist')?.value||'';
    const title=document.getElementById('af1')?.value||'';
    if(src==='spotify'){
        const url=document.getElementById('af1')?.value||'';if(!url)return toast('Paste a link');
        const m=url.match(/track\/([a-zA-Z0-9]+)/);if(!m)return toast('Invalid link');
        const songData={title:title||'Spotify Track',url:`https://open.spotify.com/embed/track/${m[1]}`,source:'Spotify',created:Date.now()};
        db.ref('users/'+me.uid+'/songs').push(songData);
        if(pid)db.ref('users/'+me.uid+'/playlists/'+pid+'/songs').push(songData);
        toast('Added to '+(pid?'playlist':'library'));closeModal();playEmbed(songData.url,songData.title,'Spotify');loadHome();
    }else if(src==='soundcloud'){
        const url=document.getElementById('af1')?.value||'';if(!url)return toast('Paste a link');
        const songData={title:title||'SoundCloud Track',url,source:'SoundCloud',created:Date.now()};
        db.ref('users/'+me.uid+'/songs').push(songData);
        if(pid)db.ref('users/'+me.uid+'/playlists/'+pid+'/songs').push(songData);
        toast('Added');closeModal();playSoundCloud(url,songData.title);loadHome();
    }else if(src==='upload'){
        const f=document.getElementById('af2')?.files[0];if(!f)return toast('Select file');
        const r=new FileReader();r.onload=e=>{
            const songData={title:title||f.name,url:e.target.result,source:'MP3',created:Date.now()};
            db.ref('users/'+me.uid+'/songs').push(songData);
            if(pid)db.ref('users/'+me.uid+'/playlists/'+pid+'/songs').push(songData);
            toast('Uploaded');closeModal();playMP3(e.target.result,songData.title);loadHome();
        };r.readAsDataURL(f);
    }
};

// Players
function playEmbed(url,title,source){
    $('player-embed').src=url;$('player-title').textContent=title;$('player-source').textContent=source||'';
    $('player-bar').classList.add('show');$('now-playing-card').innerHTML=`<div class="card"><div class="icon"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3" fill="currentColor"/></svg></div><div class="info"><div class="title">${esc(title)}</div><div class="sub">Playing</div></div></div>`;
    if(currentRoom&&isHost)db.ref('rooms/'+currentRoom+'/nowPlaying').set({url,title,source,by:uname,time:Date.now()});
}
function playSoundCloud(url,title){
    $('player-embed').style.display='none';
    if(scWidget)scWidget.load(url,{auto_play:true});else{scWidget=SC.Widget(document.getElementById('player-embed'));scWidget.load(url,{auto_play:true})}
    $('player-embed').style.display='block';$('player-title').textContent=title;$('player-source').textContent='SoundCloud';$('player-bar').classList.add('show');
    $('now-playing-card').innerHTML=`<div class="card"><div class="icon"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3" fill="currentColor"/></svg></div><div class="info"><div class="title">${esc(title)}</div><div class="sub">SoundCloud</div></div></div>`;
    if(currentRoom&&isHost)db.ref('rooms/'+currentRoom+'/nowPlaying').set({url,title,source:'SoundCloud',by:uname,time:Date.now()});
}
function playMP3(url,title){
    $('player-embed').src=url;$('player-title').textContent=title;$('player-source').textContent='MP3';$('player-bar').classList.add('show');
    $('now-playing-card').innerHTML=`<div class="card"><div class="icon"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3" fill="currentColor"/></svg></div><div class="info"><div class="title">${esc(title)}</div><div class="sub">MP3</div></div></div>`;
    if(currentRoom&&isHost)db.ref('rooms/'+currentRoom+'/nowPlaying').set({url,title,source:'MP3',by:uname,time:Date.now()});
}
function playFromQueue(i){queueIndex=i;const s=queue[i];if(!s)return;
    if(s.source==='Spotify')playEmbed(s.url,s.title,'Spotify');else if(s.source==='SoundCloud')playSoundCloud(s.url,s.title);else playMP3(s.url,s.title);updateQueueUI()}

// Pages
window.openPage=function(page){
    currentPage=page;const t={playlists:'Playlists',friends:'Friends',rooms:'Rooms'};$('page-title').textContent=t[page]||page;
    $('page-add').onclick=()=>openModal(page);$('home-screen').classList.add('hidden');$('page-screen').classList.remove('hidden');loadPage(page);
};
function openModal(type){
    const mc=$('modal-content');
    if(type==='playlists')mc.innerHTML=`<h2>New Playlist</h2><input id="f1" placeholder="Name"><div class="btn-row"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="addPlaylist()">Create</button></div>`;
    else if(type==='friends')mc.innerHTML=`<h2>Add Friend</h2><input id="f1" placeholder="Username"><div class="btn-row"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="addFriend()">Add</button></div>`;
    else if(type==='rooms'){const n=prompt('Room name:');if(n){db.ref('rooms').push({name:n,host:uname,hostId:me.uid,listeners:0,created:Date.now()});toast('Room created')}}
    $('modal').classList.add('on');
}
window.openModal=openModal;window.closeModal=()=>$('modal').classList.remove('on');
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});
window.goHome=()=>{$('page-screen').classList.add('hidden');$('home-screen').classList.remove('hidden');loadHome()};
function loadPage(page){
    if(page==='rooms'){db.ref('rooms').once('value').then(s=>{const d=s.val();let h='';if(d)Object.entries(d).forEach(([k,v])=>h+=`<div class="card" onclick="joinRoom('${k}','${esc(v.name)}','${v.hostId||''}')"><div class="icon"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/></svg></div><div class="info"><div class="title">${esc(v.name)}</div><div class="sub">Host: ${esc(v.host||'')} • ${v.listeners||0} listening</div></div></div>`);$('page-content').innerHTML=h||'<div class="empty-card">No rooms</div>'})}
    else if(page==='playlists'){db.ref('users/'+me.uid+'/playlists').once('value').then(s=>{const d=s.val();let h='';if(d)Object.entries(d).forEach(([k,v])=>h+=`<div class="card" onclick="openPlaylist('${k}','${esc(v.name)}')"><div class="icon"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/></svg></div><div class="info"><div class="title">${esc(v.name)}</div><div class="sub">${v.songs?v.songs.length:0} songs</div></div></div>`);$('page-content').innerHTML=h||'<div class="empty-card">No playlists</div>'})}
    else{db.ref('users/'+me.uid+'/'+page).once('value').then(s=>{const d=s.val();let h='';if(d)Object.values(d).forEach(v=>h+=`<div class="card"><div class="icon"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/></svg></div><div class="info"><div class="title">${esc(v.name||v)}</div></div></div>`);$('page-content').innerHTML=h||'<div class="empty-card">Nothing</div>'})}
}
window.openPlaylist=function(pid,pname){db.ref('users/'+me.uid+'/playlists/'+pid).once('value').then(s=>{const d=s.val();if(!d||!d.songs)return toast('Empty');queue=d.songs;queueIndex=0;goHome();playFromQueue(0);updateQueueUI();toast('Playing: '+pname)})};
window.addPlaylist=function(){const n=document.getElementById('f1')?.value;if(!n)return toast('Enter name');db.ref('users/'+me.uid+'/playlists').push({name:n,songs:[],created:Date.now()});toast('Created');closeModal();loadPage('playlists')};
window.addFriend=function(){const n=document.getElementById('f1')?.value;if(!n)return toast('Enter username');db.ref('usernames/'+n).once('value').then(s=>{if(s.exists()){db.ref('users/'+me.uid+'/friends').push({name:n});toast('Added');closeModal()}else toast('Not found')})};

// Rooms with Host Controls
window.joinRoom=function(rid,rn,hostId){
    currentRoom=rid;isHost=(hostId===me.uid);$('room-title').textContent=rn;
    $('room-host-btn').textContent=isHost?'You are Host':'Listener';
    $('room-screen').classList.remove('hidden');$('home-screen').classList.add('hidden');$('page-screen').classList.add('hidden');$('room-chat').classList.add('show');
    db.ref('rooms/'+rid+'/listeners').transaction(v=>(v||0)+1);
    db.ref('rooms/'+rid+'/chat').limitToLast(30).on('child_added',s=>{const d=s.val();$('room-content').innerHTML+=`<div style="padding:4px 0;font-size:13px"><b>${esc(d.from||'')}:</b> ${esc(d.text||'')}</div>`;$('room-content').scrollTop=$('room-content').scrollHeight});
    db.ref('rooms/'+rid+'/nowPlaying').on('value',s=>{const d=s.val();if(d){$('player-title').textContent=d.title||'';$('player-source').textContent=(d.source||'')+' by '+d.by;$('player-bar').classList.add('show');$('now-playing-card').innerHTML=`<div class="card"><div class="icon"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3" fill="currentColor"/></svg></div><div class="info"><div class="title">${esc(d.title||'')}</div><div class="sub">Added by ${esc(d.by||'')} • ${esc(d.source||'')}</div></div></div>`;if(d.source==='Spotify')$('player-embed').src=d.url;else if(d.source==='SoundCloud'){if(scWidget)scWidget.load(d.url,{auto_play:true})}else $('player-embed').src=d.url}});
    db.ref('rooms/'+rid+'/listeners').onDisconnect().transaction(v=>Math.max(0,(v||1)-1));
    if(isHost){$('room-content').innerHTML+='<div style="padding:8px;color:var(--accent);font-size:12px;text-align:center">You are the host. Add music to play for everyone.</div>'}
};
window.leaveRoom=function(){if(currentRoom){db.ref('rooms/'+currentRoom+'/listeners').transaction(v=>Math.max(0,(v||1)-1));db.ref('rooms/'+currentRoom+'/chat').off();db.ref('rooms/'+currentRoom+'/nowPlaying').off();currentRoom=null;isHost=false}$('room-screen').classList.add('hidden');$('room-chat').classList.remove('show');goHome()};
window.sendChat=function(){if(!currentRoom)return;const t=$('chat-inp').value.trim();if(!t)return;db.ref('rooms/'+currentRoom+'/chat').push({from:uname,text:t,timestamp:Date.now()});$('chat-inp').value=''};
window.shareRoom=function(){if(currentRoom){navigator.clipboard.writeText(currentRoom);toast('Room code copied')}};
</script>
</body>
</html>
