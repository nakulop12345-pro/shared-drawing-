<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nakul's Game</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0a0a0f;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    color: #e8e8f0;
  }
  #splash {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at 50% 50%, #1a1a2e 0%, #0a0a0f 70%);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 40px 24px; text-align: center;
    transition: opacity 0.8s ease;
  }
  #splash.hide { opacity: 0; pointer-events: none; }

  .logo-ring {
    width: 90px; height: 90px;
    border-radius: 50%;
    border: 2px solid rgba(255, 51, 102, 0.4);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 28px; position: relative;
    animation: pulseRing 2s ease-in-out infinite;
  }
  .logo-ring::before {
    content: ''; position: absolute; inset: -10px;
    border-radius: 50%;
    border: 1px solid rgba(255, 51, 102, 0.2);
    animation: pulseRing 2s ease-in-out infinite 0.3s;
  }
  .logo-ring span { font-size: 40px; font-weight: 800; color: #ff3366; }
  @keyframes pulseRing {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.08); opacity: 0.6; }
  }

  .owner-label {
    font-size: 11px; letter-spacing: 4px;
    text-transform: uppercase;
    color: #555568; margin-bottom: 12px; font-weight: 500;
  }
  .owner-name {
    font-size: clamp(28px, 6vw, 44px);
    font-weight: 800; letter-spacing: -1px;
    background: linear-gradient(135deg, #ff3366, #a855f7, #60a5fa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px; line-height: 1.1;
  }
  .divider {
    width: 60px; height: 2px;
    background: linear-gradient(90deg, transparent, #ff3366, transparent);
    margin: 28px 0 40px;
  }
  .enter-btn {
    padding: 16px 42px;
    border-radius: 50px;
    border: 2px solid #ff3366;
    background: transparent; color: #ff3366;
    font-size: 13px; font-weight: 700;
    letter-spacing: 3px; text-transform: uppercase;
    cursor: pointer; font-family: inherit;
    transition: all 0.25s;
    animation: btnGlow 2s ease-in-out infinite;
  }
  .enter-btn:hover {
    background: #ff3366; color: #fff;
    box-shadow: 0 0 40px rgba(255, 51, 102, 0.5);
    transform: translateY(-2px);
  }
  .enter-btn:active { transform: translateY(0); }
  @keyframes btnGlow {
    0%, 100% { box-shadow: 0 0 20px rgba(255, 51, 102, 0.2); }
    50% { box-shadow: 0 0 35px rgba(255, 51, 102, 0.4); }
  }

  .footer-note {
    position: absolute; bottom: 24px;
    font-size: 10px; letter-spacing: 2px;
    color: #333345; text-transform: uppercase;
  }

  #watermark {
    position: fixed;
    bottom: 12px; right: 14px;
    font-size: 9px; letter-spacing: 2px;
    color: rgba(255,255,255,0.15);
    text-transform: uppercase;
    z-index: 100;
    pointer-events: none;
    display: none;
  }
</style>
</head>
<body>

<div id="splash">
  <div class="logo-ring"><span>N</span></div>
  <div class="owner-label">Owned &amp; Operated By</div>
  <div class="owner-name">Nakul Sharma</div>
  <div class="divider"></div>
  <button class="enter-btn" onclick="enterGame()">Enter Game</button>
  <div class="footer-note">© 2025 Nakul Sharma</div>
</div>

<div id="watermark">© Nakul Sharma</div>

<script>
function enterGame() {
  var splash = document.getElementById('splash');
  splash.classList.add('hide');

  setTimeout(function() {
    document.getElementById('watermark').style.display = 'block';
    // Redirect to your game
    window.location.href = 'game.html';
  }, 800);
}
</script>

</body>
</html>
