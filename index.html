<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>NAKUL SHARMA</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

.intro {
    width: 100vw;
    height: 100vh;
    height: 100dvh;

    display: flex;
    justify-content: center;
    align-items: center;

    text-align: center;

    background:
        radial-gradient(
            circle at center,
            #171717 0%,
            #070707 45%,
            #000 80%
        );

    animation: fadeOut 1.5s ease 6s forwards;
}

.content {
    width: 90%;
    max-width: 1100px;

    animation: cinematicIn 2.5s cubic-bezier(.16,1,.3,1) forwards;
}

.small {
    font-size: clamp(9px, 1.5vw, 16px);
    letter-spacing: clamp(3px, 0.8vw, 8px);
    color: #aaa;

    opacity: 0;

    animation: fadeUp 1.5s ease 0.5s forwards;
}

.name {
    margin-top: clamp(12px, 2vw, 22px);

    font-size: clamp(34px, 8vw, 100px);

    font-weight: 800;

    letter-spacing: clamp(4px, 1.2vw, 14px);

    line-height: 1.1;

    text-transform: uppercase;

    background: linear-gradient(
        90deg,
        #555,
        #fff,
        #777,
        #fff,
        #444
    );

    background-size: 300%;

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    animation:
        fadeUp 1.8s ease 1s forwards,
        shine 3s linear 2s infinite;

    opacity: 0;
}

.line {
    width: min(260px, 55vw);
    height: 1px;

    background: #fff;

    margin: clamp(18px, 4vw, 30px) auto;

    animation: expand 1.5s ease 2.3s forwards;
}

.copyright {
    font-size: clamp(8px, 1.4vw, 13px);

    letter-spacing: clamp(2px, 0.6vw, 5px);

    color: #888;

    opacity: 0;

    animation: fadeUp 1.5s ease 2.6s forwards;
}

.loading {
    position: absolute;

    bottom: clamp(25px, 6vh, 55px);

    left: 50%;

    transform: translateX(-50%);

    width: 90%;

    text-align: center;

    font-size: clamp(8px, 1.3vw, 11px);

    letter-spacing: clamp(2px, 0.5vw, 4px);

    color: #555;

    opacity: 0;

    animation: fadeUp 1s ease 4s forwards;
}

.loading::after {
    content: "";

    display: inline-block;

    width: 0;
    height: 1px;

    background: #777;

    margin-left: 8px;

    vertical-align: middle;

    animation: loading 2s ease 4s forwards;
}


/* CINEMATIC ANIMATIONS */

@keyframes cinematicIn {

    from {
        transform: scale(1.15);
        filter: blur(15px);
    }

    to {
        transform: scale(1);
        filter: blur(0);
    }
}

@keyframes fadeUp {

    from {
        opacity: 0;
        transform: translateY(25px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes expand {

    from {
        width: 0;
    }

    to {
        width: min(260px, 55vw);
    }
}

@keyframes shine {

    0% {
        background-position: 300%;
    }

    100% {
        background-position: -300%;
    }
}

@keyframes loading {

    from {
        width: 0;
    }

    to {
        width: 70px;
    }
}

@keyframes fadeOut {

    to {
        opacity: 0;
        visibility: hidden;
    }
}


/* EXTRA PHONE OPTIMIZATION */

@media (max-width: 600px) {

    .content {
        width: 94%;
    }

    .name {
        letter-spacing: 5px;
    }

    .small {
        letter-spacing: 3px;
    }

    .copyright {
        letter-spacing: 2px;
    }
}


/* VERY SMALL PHONES */

@media (max-width: 360px) {

    .name {
        font-size: 31px;
        letter-spacing: 3px;
    }

    .small {
        font-size: 8px;
        letter-spacing: 2px;
    }

    .copyright {
        font-size: 7px;
    }
}
</style>
</head>

<body>

<div class="intro">

    <div class="content">

        <div class="small">
            OWNED AND OPERATED BY
        </div>

        <div class="name">
            NAKUL SHARMA
        </div>

        <div class="line"></div>

        <div class="copyright">
            © NAKUL SHARMA — ALL RIGHTS RESERVED
        </div>

    </div>

    <div class="loading">
        LOADING EXPERIENCE
    </div>

</div>

<script>
setTimeout(() => {
    window.location.href = "game.html";
}, 7500);
</script>

</body>
</html>
