    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #050505;

        #welcome-screen h1 {

        .btn-primary {

        /* Connect Screen */

        #brush-sizes { display: flex; gap: 8px; align-items: center; padding: 0 8px; }
        .brush-dot { border-radius: 50%; background: white; cursor: pointer; transition: all 0.2s; border: 2px solid transparent; }
        .brush-dot.small { width: 8px; height: 8px; }
        .brush-dot.medium { width: 14px; height: 14px; }
        .brush-dot.large { width: 22px; height: 22px; }
        .brush-dot.active { border-color: #6366f1; box-shadow: 0 0 12px rgba(99, 102, 241, 0.5); }

        #color-row { display: flex; gap: 8px; padding: 0 4px; }
        .color-dot {
            width: 26px; height: 26px; border-radius: 50%;
            cursor: pointer; border: 2.5px solid transparent;
            transition: all 0.2s; flex-shrink: 0;

        .color-dot:active { transform: scale(1.2); }
        .color-dot.active { border-color: white; box-shadow: 0 0 14px currentColor; }

        #top-bar {
            position: fixed; top: 16px; left: 16px; right: 16px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 200; pointer-events: none;

        #top-bar > * { pointer-events: auto; }
        .top-pill {
            padding: 10px 16px;
            background: rgba(18, 18, 18, 0.85);
            border-radius: 50px;
            backdrop-filter: blur(30px);

        .icon-btn {
            width: 40px; height: 40px; border-radius: 50%;

        #status-toast {
            position: fixed; bottom: 110px; left: 50%;
            transform: translateX(-50%) translateY(20px);

            z-index: 200; pointer-events: none; opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.06);

        #status-toast.show {

<body>

    <!-- Welcome Screen -->
    <div id="welcome-screen" class="screen">
        <div>
            <div class="logo">
                <img src="https://i.ibb.co/fd51Hp7f/icon.png" alt="Link">
            </div>
            <h1>Link</h1>
            <p class="subtitle">Draw together in real time.<br>Just you and one other person.</p>
            <button class="btn-primary" id="google-login-btn">Sign in with Google</button>
        </div>
    </div>

    <!-- Connect Screen -->
    <div id="connect-screen" class="screen hidden">
        <div>
            <h2>👋 Connect</h2>
            <p class="desc">Share your code or enter theirs</p>
            <div class="code-display">
                <div class="label">Your Code</div>
                <div class="code" id="my-code">----</div>
            </div>
            <input type="text" id="partner-code-input" placeholder="Enter their code" maxlength="6" autocomplete="off" autocapitalize="characters">
            <br>
            <button class="btn-primary" onclick="connectWithPartner()" style="margin-top:8px;">Connect</button>
            <br>
            <button class="btn-secondary" onclick="copyCode()">📋 Copy My Code</button>
            <button class="btn-danger" onclick="signOut()">Sign Out</button>
            <p id="connect-error"></p>
            <p id="user-display"></p>
        </div>
    </div>

    <!-- Drawing Screen -->
    <div id="drawing-screen" class="screen hidden">
        <canvas id="wallpaper"></canvas>
        
        <div id="top-bar">
            <div class="top-pill">
                <span class="dot"></span>
                <span id="partner-name">Connected</span>
            </div>
            <div style="display:flex; gap:8px;">
                <button class="icon-btn" onclick="goBack()" title="Disconnect">←</button>
                <button class="icon-btn" onclick="clearWallpaper()" title="Clear">🗑</button>
            </div>
        </div>

        <div id="status-toast">Ready</div>

        <div id="toolbar">
            <button class="tool-btn active" id="pen-tool" onclick="setTool('pen')" title="Pen">✏️</button>
            <button class="tool-btn" id="marker-tool" onclick="setTool('marker')" title="Marker">🖍</button>
            <button class="tool-btn" id="spray-tool" onclick="setTool('spray')" title="Spray">🎨</button>
            
            <div style="width:1px; height:24px; background:rgba(255,255,255,0.1); margin:0 4px;"></div>
            
            <div id="brush-sizes">
                <div class="brush-dot small active" data-size="2" onclick="setBrushSize(2, this)"></div>
                <div class="brush-dot medium" data-size="5" onclick="setBrushSize(5, this)"></div>
                <div class="brush-dot large" data-size="12" onclick="setBrushSize(12, this)"></div>
            </div>

            <div style="width:1px; height:24px; background:rgba(255,255,255,0.1); margin:0 4px;"></div>

            <div id="color-row">
                <div class="color-dot active" style="background:#ffffff;" data-color="#ffffff"></div>
                <div class="color-dot" style="background:#ef4444;" data-color="#ef4444"></div>
                <div class="color-dot" style="background:#f59e0b;" data-color="#f59e0b"></div>
                <div class="color-dot" style="background:#10b981;" data-color="#10b981"></div>
                <div class="color-dot" style="background:#6366f1;" data-color="#6366f1"></div>
                <div class="color-dot" style="background:#ec4899;" data-color="#ec4899"></div>
                <div class="color-dot" style="background:#8b5cf6;" data-color="#8b5cf6"></div>
            </div>
        </div>
    </div>

    <!-- Install Banner -->
    <div id="install-banner">
        <div class="install-icon">
            <img src="https://i.ibb.co/fd51Hp7f/icon.png" alt="Link">
        </div>
        <div class="install-info">
            <div class="install-title">Install Link</div>
            <div class="install-sub">Add to home screen for a better experience</div>
        </div>
        <button class="install-btn" id="install-btn">Install</button>
        <button class="dismiss-btn" id="dismiss-btn">✕</button>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <script>
        // ============================================
        // FIREBASE CONFIG
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyAr_Fcr_IbMl9syK4zxep3ar9OEHHBppT8",
            authDomain: "myos-8e487.firebaseapp.com",
            databaseURL: "https://myos-8e487-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "myos-8e487",
            storageBucket: "myos-8e487.firebasestorage.app",
            messagingSenderId: "1020781755391",
            appId: "1:1020781755391:web:2bb6987486feb02b2ec5ca"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        // ============================================
        // PWA INSTALL
        // ============================================
        let deferredPrompt;
        const installBanner = document.getElementById('install-banner');
        const installBtn = document.getElementById('install-btn');
        const dismissBtn = document.getElementById('dismiss-btn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBanner.classList.add('show');
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                deferredPrompt = null;
                installBanner.classList.remove('show');
            }
        });

        dismissBtn.addEventListener('click', () => {
            installBanner.classList.remove('show');
        });

        window.addEventListener('appinstalled', () => {
            installBanner.classList.remove('show');
        });

        // ============================================
        // DOM ELEMENTS
        // ============================================
        const welcomeScreen = document.getElementById('welcome-screen');
        const connectScreen = document.getElementById('connect-screen');
        const drawingScreen = document.getElementById('drawing-screen');
        const googleLoginBtn = document.getElementById('google-login-btn');
        const connectError = document.getElementById('connect-error');
        const userDisplay = document.getElementById('user-display');
        const partnerName = document.getElementById('partner-name');
        const statusToast = document.getElementById('status-toast');

        // ============================================
        // STATE
        // ============================================
        let currentUser = null;
        let myCode = "";
        let partnerCode = "";
        let roomId = "";
        let currentColor = "#ffffff";
        let brushSize = 2;
        let currentTool = "pen";
        let isDrawing = false;
        let canvas, ctx;
        let lastX = 0, lastY = 0;
        let lastTimestamp = 0;
        let sprayInterval = null;

        // ============================================
        // CANVAS SETUP
        // ============================================
        canvas = document.getElementById('wallpaper');
        ctx = canvas.getContext('2d');
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineWidth = brushSize;

        function resizeCanvas() {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ctx.putImageData(imageData, 0, 0);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
        }
        window.addEventListener('resize', resizeCanvas);

        // ============================================
        // SCREEN TRANSITIONS
        // ============================================
        function showScreen(screen) {
            [welcomeScreen, connectScreen, drawingScreen].forEach(s => s.classList.add('hidden'));
            screen.classList.remove('hidden');
        }

        function showToast(msg, duration = 1500) {
            statusToast.textContent = msg;
            statusToast.classList.add('show');
            setTimeout(() => statusToast.classList.remove('show'), duration);
        }

        // ============================================
        // AUTH
        // ============================================
        googleLoginBtn.addEventListener('click', () => {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(err => {
                console.error("Login error:", err);
                alert("Login failed. Try again.");
            });
        });

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                showScreen(connectScreen);
                userDisplay.textContent = `Signed in as: ${user.displayName}`;
                setupUser();
            } else {
                currentUser = null;
                showScreen(welcomeScreen);
            }
        });

        function setupUser() {
            myCode = currentUser.uid.substring(0, 6).toUpperCase();
            document.getElementById('my-code').textContent = myCode;
            
            database.ref('users/' + currentUser.uid).set({
                name: currentUser.displayName,
                code: myCode,
                lastSeen: Date.now()
            });

            database.ref('users/' + currentUser.uid + '/connectedTo').on('value', snapshot => {
                const data = snapshot.val();
                if (data && data.partnerId) {
                    partnerCode = data.partnerCode;
                    roomId = data.roomId;
                    openDrawingScreen(data.partnerName);
                }
            });
        }

        function connectWithPartner() {
            const inputCode = document.getElementById('partner-code-input').value.trim().toUpperCase();
            if (!inputCode) { connectError.textContent = "Enter a code"; return; }
            if (inputCode === myCode) { connectError.textContent = "That's your own code"; return; }
            
            connectError.textContent = "Looking for user...";
            connectError.className = '';
            
            database.ref('users').orderByChild('code').equalTo(inputCode).once('value')
                .then(snapshot => {
                    if (snapshot.exists()) {
                        const partnerData = snapshot.val();
                        const partnerId = Object.keys(partnerData)[0];
                        const pName = partnerData[partnerId].name || "Partner";
                        const ids = [currentUser.uid, partnerId].sort();
                        roomId = ids[0] + '_' + ids[1];
                        partnerCode = inputCode;
                        
                        const updates = {};
                        updates['users/' + currentUser.uid + '/connectedTo'] = {
                            partnerId, partnerCode, roomId, partnerName: pName
                        };
                        updates['users/' + partnerId + '/connectedTo'] = {
                            partnerId: currentUser.uid, partnerCode: myCode, roomId, partnerName: currentUser.displayName
                        };
                        return database.ref().update(updates);
                    } else {
                        connectError.textContent = "Code not found. Ask them to share their code.";
                        throw new Error("Not found");
                    }
                })
                .then(() => {
                    connectError.textContent = "";
                    openDrawingScreen();
                })
                .catch(err => {
                    if (err.message !== "Not found") connectError.textContent = "Connection failed. Try again.";
                });
        }
        window.connectWithPartner = connectWithPartner;

        function copyCode() {
            navigator.clipboard.writeText(myCode).then(() => {
                connectError.textContent = "✅ Code copied!";
                connectError.className = 'success-msg';
                setTimeout(() => { connectError.textContent = ""; connectError.className = ''; }, 2000);
            }).catch(() => {
                connectError.textContent = "Couldn't copy. Your code: " + myCode;
            });
        }
        window.copyCode = copyCode;

        function signOut() {
            if (currentUser && roomId) database.ref('users/' + currentUser.uid + '/connectedTo').remove();
            auth.signOut();
        }
        window.signOut = signOut;

        function openDrawingScreen(pName) {
            showScreen(drawingScreen);
            resizeCanvas();
            partnerName.textContent = pName || "Connected";
            lastTimestamp = 0;
            showToast("🟢 Connected");
            loadCanvas();
            startListening();
        }

        function goBack() {
            showScreen(connectScreen);
            if (currentUser) database.ref('users/' + currentUser.uid + '/connectedTo').remove();
            partnerCode = "";
            roomId = "";
            showToast("Disconnected");
        }
        window.goBack = goBack;

        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tool + '-tool').classList.add('active');
            if (sprayInterval) { clearInterval(sprayInterval); sprayInterval = null; }
        }
        window.setTool = setTool;

        function setBrushSize(size, el) {
            brushSize = size;
            document.querySelectorAll('.brush-dot').forEach(d => d.classList.remove('active'));
            el.classList.add('active');
        }
        window.setBrushSize = setBrushSize;

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
        }

        function startDraw(e) {
            isDrawing = true;
            const pos = getPos(e);
            lastX = pos.x;
            lastY = pos.y;
            if (currentTool === 'spray') {
                sprayInterval = setInterval(() => spray(pos), 30);
            } else {
                ctx.fillStyle = currentColor;
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, brushSize / 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function draw(e) {
            if (!isDrawing || currentTool === 'spray') return;
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(pos.x, pos.y);
            ctx.strokeStyle = currentColor;
            ctx.lineWidth = brushSize;
            if (currentTool === 'marker') {
                ctx.globalAlpha = 0.6;
                ctx.lineWidth = brushSize * 2.5;
            } else {
                ctx.globalAlpha = 1;
            }
            ctx.stroke();
            ctx.globalAlpha = 1;
            lastX = pos.x;
            lastY = pos.y;
        }

        function spray(pos) {
            const count = Math.floor(brushSize * 2);
            for (let i = 0; i < count; i++) {
                const offsetX = (Math.random() - 0.5) * brushSize * 5;
                const offsetY = (Math.random() - 0.5) * brushSize * 5;
                const distance = Math.sqrt(offsetX * offsetX + offsetY * offsetY);
                if (distance < brushSize * 2.5) {
                    ctx.fillStyle = currentColor;
                    ctx.globalAlpha = Math.random() * 0.5 + 0.3;
                    ctx.beginPath();
                    ctx.arc(pos.x + offsetX, pos.y + offsetY, Math.random() * 2 + 0.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            ctx.globalAlpha = 1;
        }

        function stopDraw() {
            if (!isDrawing) return;
            isDrawing = false;
            if (sprayInterval) { clearInterval(sprayInterval); sprayInterval = null; }
            saveCanvas();
            showToast("💾 Saved");
        }

        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDraw);
        canvas.addEventListener('mouseleave', stopDraw);
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            startDraw({ clientX: e.touches[0].clientX, clientY: e.touches[0].clientY });
        }, { passive: false });
        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            if (currentTool === 'spray') {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const pos = { x: (e.touches[0].clientX - rect.left) * scaleX, y: (e.touches[0].clientY - rect.top) * scaleY };
                lastX = pos.x;
                lastY = pos.y;
            } else {
                draw({ clientX: e.touches[0].clientX, clientY: e.touches[0].clientY });
            }
        }, { passive: false });
        canvas.addEventListener('touchend', e => {
            e.preventDefault();
            stopDraw();
        }, { passive: false });

        document.querySelectorAll('.color-dot').forEach(dot => {
            dot.addEventListener('click', function() {
                currentColor = this.dataset.color;
                document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
                this.classList.add('active');
            });
        });

        function clearWallpaper() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (roomId) {
                database.ref('rooms/' + roomId + '/canvas').set({
                    imageData: null, action: 'clear', timestamp: Date.now()
                });
            }
            showToast("🗑 Cleared");
        }
        window.clearWallpaper = clearWallpaper;

        function saveCanvas() {
            if (!roomId) return;
            const imageData = canvas.toDataURL('image/png');
            database.ref('rooms/' + roomId + '/canvas').set({ imageData, timestamp: Date.now() });
        }

        function loadCanvas() {
            if (!roomId) return;
            database.ref('rooms/' + roomId + '/canvas').once('value').then(snapshot => {
                const data = snapshot.val();
                if (data && data.imageData && data.action !== 'clear') {
                    const img = new Image();
                    img.onload = () => { ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.drawImage(img, 0, 0, canvas.width, canvas.height); };
                    img.src = data.imageData;
                }
            });
        }

        function startListening() {
            database.ref('rooms/' + roomId + '/canvas').on('value', snapshot => {
                const data = snapshot.val();
                if (!data || isDrawing) return;
                if (data.timestamp && data.timestamp > lastTimestamp) {
                    lastTimestamp = data.timestamp;
                    if (data.action === 'clear') {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        showToast("🗑 Partner cleared");
                    } else if (data.imageData) {
                        const img = new Image();
                        img.onload = () => { ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.drawImage(img, 0, 0, canvas.width, canvas.height); showToast("✏️ Partner updated"); };
                        img.src = data.imageData;
                    }
                }
            });
        }

        console.log("✅ Link PWA ready");
    </script>
</body>
</html>
