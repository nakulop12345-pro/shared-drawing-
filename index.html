```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAKUL SHARMA</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background: #000;
        color: #fff;
        height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, Helvetica, sans-serif;
    }

    .intro {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        background:
            radial-gradient(circle at center, #171717 0%, #050505 45%, #000 80%);
        animation: fadeOut 1.5s ease 6s forwards;
    }

    .content {
        animation: cinematicIn 2.5s cubic-bezier(.16,1,.3,1) forwards;
    }

    .small {
        font-size: 13px;
        letter-spacing: 8px;
        color: #aaa;
        opacity: 0;
        animation: fadeUp 1.5s ease 0.5s forwards;
    }

    .name {
        margin-top: 18px;
        font-size: clamp(42px, 8vw, 100px);
        font-weight: 800;
        letter-spacing: 12px;
        text-transform: uppercase;

        background: linear-gradient(
            90deg,
            #555,
            #fff,
            #777,
            #fff,
            #444
        );
        background-size: 300%;
        -webkit-background-clip: text;
        color: transparent;

        animation:
            fadeUp 1.8s ease 1s forwards,
            shine 3s linear 2s infinite;
        opacity: 0;
    }

    .line {
        width: 0;
        height: 1px;
        background: #fff;
        margin: 28px auto;
        animation: expand 1.5s ease 2.3s forwards;
    }

    .copyright {
        font-size: 12px;
        letter-spacing: 5px;
        color: #888;
        opacity: 0;
        animation: fadeUp 1.5s ease 2.6s forwards;
    }

    .loading {
        position: absolute;
        bottom: 50px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 10px;
        letter-spacing: 4px;
        color: #555;
        opacity: 0;
        animation: fadeUp 1s ease 4s forwards;
    }

    .loading::after {
        content: "";
        display: inline-block;
        width: 0;
        height: 1px;
        background: #777;
        margin-left: 10px;
        vertical-align: middle;
        animation: loading 2s ease 4s forwards;
    }

    @keyframes cinematicIn {
        from {
            transform: scale(1.15);
            filter: blur(15px);
        }
        to {
            transform: scale(1);
            filter: blur(0);
        }
    }

    @keyframes fadeUp {
        from {
            opacity: 0;
            transform: translateY(25px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes expand {
        from { width: 0; }
        to { width: 260px; }
    }

    @keyframes shine {
        0% { background-position: 300%; }
        100% { background-position: -300%; }
    }

    @keyframes loading {
        from { width: 0; }
        to { width: 80px; }
    }

    @keyframes fadeOut {
        to {
            opacity: 0;
            visibility: hidden;
        }
    }
</style>
</head>

<body>

<div class="intro">

    <div class="content">

        <div class="small">
            OWNED AND OPERATED BY
        </div>

        <div class="name">
            NAKUL SHARMA
        </div>

        <div class="line"></div>

        <div class="copyright">
            © NAKUL SHARMA — ALL RIGHTS RESERVED
        </div>

    </div>

    <div class="loading">
        LOADING EXPERIENCE
    </div>

</div>

<script>
    // Open the actual game after the cinematic intro
    setTimeout(() => {
        window.location.href = "game.html";
    }, 7500);
</script>

</body>
</html>
```
