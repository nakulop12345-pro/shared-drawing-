<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Vault — Life Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:#03030a;--surface:rgba(10,10,30,0.7);--surface2:rgba(18,18,45,0.8);--border:rgba(255,255,255,0.04);--border2:rgba(255,255,255,0.08);
            --text:#e8e8f0;--text2:#9090b0;--text3:#555580;
            --accent:#6366f1;--accent2:#818cf8;--glow:rgba(99,102,241,0.25);--neon:#a855f7;
            --danger:#ef4444;--success:#22c55e;--warning:#f59e0b;--info:#3b82f6;--pink:#ec4899;--teal:#14b8a6;
            --radius:16px;--radius-sm:12px;--radius-xs:8px;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#000;font-family:'Inter',-apple-system,sans-serif;height:100dvh;overflow:hidden;-webkit-tap-highlight-color:transparent;color:var(--text);display:flex;justify-content:center}
        .app{width:100%;max-width:500px;height:100dvh;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
        @media(min-width:501px){.app{border-left:1px solid var(--border2);border-right:1px solid var(--border2)}}

        .header{padding:16px 18px 12px;display:flex;align-items:center;justify-content:space-between;background:transparent;z-index:10}
        .header h1{font-size:22px;font-weight:800;letter-spacing:-0.5px;background:linear-gradient(135deg,var(--accent2),var(--neon),var(--teal));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .avatar-btn{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--neon));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;cursor:pointer;border:none;box-shadow:0 0 20px var(--glow)}

        .main-content{flex:1;overflow-y:auto;padding:0 14px 10px;scroll-behavior:smooth}
        .greeting{margin-bottom:16px}.greeting .time{font-size:13px;color:var(--text2)}.greeting .name{font-size:22px;font-weight:800;color:var(--text)}

        .section{margin-bottom:8px}
        .section-header{display:flex;justify-content:space-between;align-items:center;padding:8px 4px}
        .section-header h3{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text3);font-weight:600}
        .section-header .add{font-size:12px;color:var(--accent2);cursor:pointer;font-weight:600;padding:4px 8px;border-radius:6px;transition:all .15s}
        .section-header .add:active{background:var(--glow)}

        .list-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:6px;display:flex;align-items:center;gap:12px;transition:all .2s;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);position:relative;overflow:hidden}
        .list-card:active{background:var(--surface2);transform:scale(0.985)}
        .list-card .icon{width:42px;height:42px;border-radius:var(--radius-xs);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}
        .list-card .icon.red{background:rgba(239,68,68,0.1);color:var(--danger)}.list-card .icon.green{background:rgba(34,197,94,0.1);color:var(--success)}
        .list-card .icon.blue{background:rgba(59,130,246,0.1);color:var(--info)}.list-card .icon.yellow{background:rgba(245,158,11,0.1);color:var(--warning)}
        .list-card .icon.purple{background:rgba(168,85,247,0.1);color:var(--neon)}.list-card .icon.pink{background:rgba(236,72,153,0.1);color:var(--pink)}
        .list-card .icon.teal{background:rgba(20,184,166,0.1);color:var(--teal)}
        .list-card .icon svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
        .list-card .info{flex:1;min-width:0}.list-card .title{font-size:14px;font-weight:600;margin-bottom:2px}.list-card .sub{font-size:11px;color:var(--text3)}
        .list-card .extra{text-align:right;flex-shrink:0}.list-card .amount{font-size:15px;font-weight:700}.list-card .amount.red{color:var(--danger)}.list-card .amount.green{color:var(--success)}
        .list-card .badge{font-size:10px;padding:4px 8px;border-radius:20px;font-weight:600;display:inline-block}
        .list-card .badge.soon{background:rgba(239,68,68,0.15);color:var(--danger)}.list-card .badge.ok{background:rgba(34,197,94,0.15);color:var(--success)}
        .list-card .swipe-delete{position:absolute;right:-60px;top:0;height:100%;width:60px;background:var(--danger);display:flex;align-items:center;justify-content:center;border-radius:0 var(--radius) var(--radius) 0;transition:right .2s;cursor:pointer}
        .empty-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;text-align:center;color:var(--text3);font-size:13px}

        .bottom-nav{display:flex;border-top:1px solid var(--border);background:var(--bg);padding:6px 0;min-height:56px;z-index:10}
        .nav-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--text3);font-size:10px;font-weight:500;border:none;background:none;transition:color .15s}
        .nav-tab.active{color:var(--accent2)}.nav-tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5}

        .modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:50;justify-content:flex-end;align-items:flex-end}
        .modal-overlay.on{display:flex}
        .modal-sheet{background:var(--surface2);border-radius:var(--radius) var(--radius) 0 0;padding:20px 18px 30px;width:100%;max-width:500px;max-height:80vh;overflow-y:auto;border:1px solid var(--border2);border-bottom:none;backdrop-filter:blur(30px)}
        .modal-sheet h2{font-size:18px;font-weight:700;margin-bottom:4px}
        .modal-sheet .subtitle{font-size:11px;color:var(--text3);margin-bottom:14px}
        .modal-sheet input,.modal-sheet textarea,.modal-sheet select{width:100%;padding:12px 14px;border-radius:var(--radius-xs);border:1.5px solid var(--border2);background:var(--bg);color:var(--text);font-size:13px;outline:none;font-family:'Inter',sans-serif;margin-bottom:8px;resize:vertical;transition:all .15s}
        .modal-sheet input:focus,.modal-sheet textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
        .btn-row{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
        .btn{padding:10px 20px;border-radius:var(--radius-xs);border:none;font-weight:600;cursor:pointer;font-size:12px;font-family:'Inter',sans-serif;transition:all .15s}
        .btn:active{transform:scale(.95)}.btn-primary{background:var(--accent);color:#fff}.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border2)}.btn-danger{background:var(--danger);color:#fff}

        .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--surface2);color:var(--text);font-size:12px;padding:10px 22px;border-radius:50px;z-index:100;opacity:0;transition:all .3s;pointer-events:none;border:1px solid var(--border2);white-space:nowrap;backdrop-filter:blur(20px)}
        .toast.show{opacity:1}

        @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
        .modal-sheet{animation:slideUp .3s ease}
        ::-webkit-scrollbar{width:0}
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <h1>Vault</h1>
        <button class="avatar-btn" id="login-btn" onclick="signIn()">?</button>
    </div>
    <div class="main-content" id="main-content">
        <div class="greeting"><div class="time" id="time-greet">Good Morning</div><div class="name" id="user-name">User</div></div>
        <div class="section" id="section-deadlines"></div>
        <div class="section" id="section-debts"></div>
        <div class="section" id="section-subs"></div>
        <div class="section" id="section-docs"></div>
        <div class="section" id="section-warranty"></div>
        <div class="section" id="section-gifts"></div>
        <div class="section" id="section-notes"></div>
        <div style="height:20px"></div>
    </div>
    <div class="bottom-nav">
        <button class="nav-tab active" onclick="scrollToSection('deadlines')"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/></svg>Deadlines</button>
        <button class="nav-tab" onclick="scrollToSection('debts')"><svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>Money</button>
        <button class="nav-tab" onclick="scrollToSection('subs')"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>Subs</button>
        <button class="nav-tab" onclick="scrollToSection('docs')"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/></svg>Docs</button>
        <button class="nav-tab" onclick="scrollToSection('notes')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>More</button>
    </div>
    <div class="modal-overlay" id="modal"><div class="modal-sheet" id="modal-content"></div></div>
    <div class="toast" id="toast"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyAr_Fcr_IbMl9syK4zxep3ar9OEHHBppT8",authDomain:"myos-8e487.firebaseapp.com",databaseURL:"https://myos-8e487-default-rtdb.asia-southeast1.firebasedatabase.app"});
const auth=firebase.auth(),db=firebase.database();const $=id=>document.getElementById(id);
let me=null,uname='User';

function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200)}
$('time-greet').textContent=new Date().getHours()<12?'Good Morning':new Date().getHours()<17?'Good Afternoon':'Good Evening';

window.signIn=()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
auth.onAuthStateChanged(u=>{if(u){me=u;uname=u.displayName||'User';$('user-name').textContent=uname;$('login-btn').textContent=uname[0].toUpperCase();loadAll()}else{me=null;$('login-btn').textContent='?'}});

function openModal(type){
    const mc=$('modal-content');
    if(type==='deadline')mc.innerHTML=`<h2>Add Deadline</h2><p class="subtitle">Never miss what matters</p><input id="f1" placeholder="Title"><input id="f2" type="date"><div class="btn-row"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveItem('deadlines',{title:getVal('f1'),date:getVal('f2')})">Save</button></div>`;
    else if(type==='debt')mc.innerHTML=`<h2>Log Debt</h2><p class="subtitle">Track who owes you</p><input id="f1" placeholder="Person"><input id="f2" placeholder="Amount (₹)" type="number"><input id="f3" placeholder="Note"><div class="btn-row"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveItem('debts',{person:getVal('f1'),amount:parseInt(getVal('f2')),note:getVal('f3'),paid:false})">Save</button></div>`;
    else if(type==='subscription')mc.innerHTML=`<h2>Add Subscription</h2><p class="subtitle">Track monthly payments</p><input id="f1" placeholder="Name"><input id="f2" placeholder="Monthly amount (₹)" type="number"><div class="btn-row"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveItem('subscriptions',{name:getVal('f1'),amount:parseInt(getVal('f2'))})">Save</button></div>`;
    else if(type==='document')mc.innerHTML=`<h2>Upload Document</h2><p class="subtitle">Private encrypted vault</p><input id="f1" placeholder="Name"><input type="file" id="f2"><div class="btn-row"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="uploadDoc()">Upload</button></div>`;
    else if(type==='warranty')mc.innerHTML=`<h2>Add Warranty</h2><p class="subtitle">Never miss an expiry</p><input id="f1" placeholder="Product"><input id="f2" type="date" placeholder="Expiry"><input id="f3" placeholder="Bill number"><div class="btn-row"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveItem('warranties',{product:getVal('f1'),expiry:getVal('f2'),bill:getVal('f3')})">Save</button></div>`;
    else if(type==='gift')mc.innerHTML=`<h2>Add Gift Idea</h2><p class="subtitle">Remember what they love</p><input id="f1" placeholder="Person"><input id="f2" placeholder="Gift idea"><input id="f3" type="date"><div class="btn-row"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveItem('gifts',{person:getVal('f1'),idea:getVal('f2'),date:getVal('f3')})">Save</button></div>`;
    else if(type==='note')mc.innerHTML=`<h2>Quick Note</h2><p class="subtitle">Capture thoughts instantly</p><textarea id="f1" rows="3" placeholder="Write anything..."></textarea><div class="btn-row"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveItem('notes',{text:getVal('f1')})">Save</button></div>`;
    $('modal').classList.add('on');
}
function getVal(id){const el=document.getElementById(id);return el?el.value:''}
window.openModal=openModal;
window.closeModal=()=>$('modal').classList.remove('on');
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});

window.saveItem=function(path,data){
    if(!me)return toast('Sign in first');
    if(!Object.values(data).some(v=>v))return toast('Fill required fields');
    data.created=Date.now();db.ref('users/'+me.uid+'/'+path).push(data);toast('Saved');closeModal();loadAll();
};
window.uploadDoc=function(){
    if(!me)return toast('Sign in first');
    const f=document.getElementById('f2')?.files[0];if(!f)return toast('Select file');
    const r=new FileReader();r.onload=e=>{
        db.ref('users/'+me.uid+'/documents').push({name:document.getElementById('f1')?.value||f.name,data:e.target.result,size:f.size,created:Date.now()});
        toast('Uploaded');closeModal();loadAll();
    };r.readAsDataURL(f);
};
window.deleteItem=function(path,key){if(!me)return;db.ref('users/'+me.uid+'/'+path+'/'+key).remove();toast('Deleted');loadAll();};
window.togglePaid=function(path,key,val){if(!me)return;db.ref('users/'+me.uid+'/'+path+'/'+key+'/paid').set(!val);loadAll();};

function loadAll(){if(!me)return;['deadlines','debts','subscriptions','documents','warranties','gifts','notes'].forEach(loadSection)}
function loadSection(path){
    db.ref('users/'+me.uid+'/'+path).once('value').then(s=>{
        const d=s.val();let html='',total=0;const config={
            deadlines:{icon:'red',svg:'<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/>',label:'Deadlines'},
            debts:{icon:'red',svg:'<line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/>',label:'Money'},
            subscriptions:{icon:'purple',svg:'<polyline points="20 6 9 17 4 12"/>',label:'Subscriptions'},
            documents:{icon:'blue',svg:'<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>',label:'Documents'},
            warranties:{icon:'yellow',svg:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',label:'Warranties'},
            gifts:{icon:'pink',svg:'<polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/>',label:'Gifts'},
            notes:{icon:'teal',svg:'<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/>',label:'Notes'}
        };
        const cfg=config[path];
        if(d){Object.entries(d).sort((a,b)=>b[1].created-a[1].created).forEach(([k,v])=>{
            if(path==='deadlines')html+=card(cfg,v.title,v.date,'',`<span class="badge ${new Date(v.date)<new Date()?'soon':'ok'}">${new Date(v.date)<new Date()?'OVERDUE':'Upcoming'}</span>`,path,k);
            else if(path==='debts'){total+=v.amount||0;html+=card(cfg,v.person+' — '+(v.note||''),v.paid?'Paid':'Pending',`<div class="amount ${v.paid?'green':'red'}">₹${v.amount}</div><button class="btn ${v.paid?'btn-ghost':'btn-primary'}" style="padding:4px 10px;font-size:10px;margin-top:4px" onclick="event.stopPropagation();togglePaid('${path}','${k}',${v.paid})">${v.paid?'Undo':'Paid'}</button>`,null,path,k);}
            else if(path==='subscriptions'){total+=v.amount||0;html+=card(cfg,v.name,'Monthly',`<div class="amount">₹${v.amount}</div>`,null,path,k);}
            else if(path==='documents')html+=card(cfg,v.name,(v.size/1024).toFixed(0)+' KB',`<a href="${v.data}" download="${v.name}" style="color:var(--accent2);font-size:11px;text-decoration:none">Get</a>`,null,path,k);
            else if(path==='warranties')html+=card(cfg,v.product,'Expires: '+v.expiry,'',null,path,k);
            else if(path==='gifts')html+=card(cfg,v.person+' — '+v.idea,v.date||'No date','',null,path,k);
            else if(path==='notes')html+=card(cfg,v.text,'','',null,path,k);
        });}
        if(!html)html=`<div class="empty-card">No ${cfg.label.toLowerCase()} yet</div>`;
        const sectionEl=$('section-'+path.replace('warranties','warranty').replace('subscriptions','subs'));
        if(sectionEl)sectionEl.innerHTML=`<div class="section-header"><h3>${cfg.label}</h3><span class="add" onclick="openModal('${path==='warranties'?'warranty':path==='subscriptions'?'subscription':path}')">+ Add</span></div>${html}`;
    });
}
function card(cfg,title,sub,extra,badge,path,key){
    return `<div class="list-card" onclick="event.stopPropagation()"><div class="icon ${cfg.icon}"><svg viewBox="0 0 24 24">${cfg.svg}</svg></div><div class="info"><div class="title">${title}</div><div class="sub">${sub}</div></div>${badge||''}<div class="extra">${extra||''}</div><button class="btn btn-ghost" style="position:absolute;top:6px;right:6px;padding:2px 8px;font-size:10px;opacity:0.5" onclick="deleteItem('${path}','${key}')">X</button></div>`;
}
function scrollToSection(id){const el=$('section-'+id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});}
</script>
</body>
</html>
