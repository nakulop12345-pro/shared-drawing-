<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NR — Music Together</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NR">
    <meta name="theme-color" content="#1a0a0f">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:#1a0a0f;--surface:rgba(30,12,20,0.8);--surface2:rgba(40,15,25,0.9);--border:rgba(255,192,203,0.06);--border2:rgba(255,192,203,0.12);
            --text:#f5e8ec;--text2:#c0a0a8;--text3:#805060;
            --accent:#ffb6c1;--accent2:#ffc0cb;--accent-dark:#e8929f;--glow:rgba(255,182,193,0.2);--neon:#ff69b4;
            --danger:#ff4474;--success:#7bed9f;--warning:#ffa502;--info:#70a1ff;
            --radius:16px;--radius-sm:12px;--radius-xs:8px;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#000;font-family:'Inter',-apple-system,sans-serif;height:100dvh;overflow:hidden;-webkit-tap-highlight-color:transparent;color:var(--text);display:flex;justify-content:center}
        .app{width:100%;max-width:500px;height:100dvh;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
        @media(min-width:501px){.app{border-left:1px solid var(--border2);border-right:1px solid var(--border2)}}

        .header{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;background:transparent;z-index:10;min-height:54px}
        .header h1{font-size:20px;font-weight:800;letter-spacing:-0.3px;background:linear-gradient(135deg,var(--accent),var(--neon));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .avatar-btn{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--neon));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#1a0a0f;cursor:pointer;border:none;box-shadow:0 0 20px var(--glow)}
        .back-btn{width:34px;height:34px;border-radius:50%;background:var(--surface2);border:1px solid var(--border2);color:var(--text2);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}

        .screen{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;background:var(--bg);transition:transform .3s ease,opacity .3s ease}
        .screen.hidden{opacity:0;pointer-events:none;transform:scale(0.96)}
        #login-screen{align-items:center;justify-content:center;padding:40px;text-align:center;gap:24px}
        #login-screen h2{font-size:24px;font-weight:800;color:var(--accent)}
        #login-screen p{color:var(--text2);font-size:13px;max-width:280px;line-height:1.6}
        .btn-google{padding:13px 22px;border-radius:var(--radius-sm);border:2px solid var(--accent);background:transparent;color:var(--accent);font-weight:600;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:all .15s;font-family:'Inter',sans-serif}
        .btn-google:active{background:var(--accent);color:#1a0a0f}
        .btn-google svg{width:20px;height:20px}

        .main-content{flex:1;overflow-y:auto;padding:0 14px 10px}
        .greeting{padding:4px 0 14px}.greeting .time{font-size:12px;color:var(--text2)}.greeting .name{font-size:20px;font-weight:800;color:var(--text)}

        .section-header{display:flex;justify-content:space-between;align-items:center;padding:6px 4px;margin-top:8px}
        .section-header h3{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text3);font-weight:600}

        .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
        .stat-card{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);padding:14px;text-align:center;cursor:pointer;transition:all .15s;backdrop-filter:blur(20px)}
        .stat-card:active{background:var(--surface2);transform:scale(0.97)}
        .stat-card .stat-num{font-size:22px;font-weight:800;color:var(--accent)}
        .stat-card .stat-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-top:2px}

        .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px 14px;margin-bottom:6px;display:flex;align-items:center;gap:12px;transition:all .15s;backdrop-filter:blur(20px);cursor:pointer}
        .card:active{background:var(--surface2)}
        .card .icon{width:38px;height:38px;border-radius:var(--radius-xs);display:flex;align-items:center;justify-content:center;flex-shrink:0;background:rgba(255,182,193,0.1);color:var(--accent)}
        .card .icon svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
        .card .info{flex:1;min-width:0}.card .title{font-size:13px;font-weight:600}.card .sub{font-size:11px;color:var(--text3)}
        .empty-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;text-align:center;color:var(--text3);font-size:12px}

        .mini-player{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;background:var(--surface2);border-top:1px solid var(--border2);padding:10px 14px;display:none;align-items:center;gap:12px;z-index:30;backdrop-filter:blur(30px)}
        .mini-player.show{display:flex}
        .mini-player .song-info{flex:1;min-width:0}.mini-player .song-title{font-size:13px;font-weight:600}.mini-player .song-artist{font-size:11px;color:var(--text3)}
        .mini-player .controls{display:flex;gap:8px}.mini-player .ctrl-btn{width:34px;height:34px;border-radius:50%;border:none;background:var(--accent);color:#1a0a0f;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}

        .modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:50;justify-content:flex-end;align-items:flex-end}
        .modal-overlay.on{display:flex}
        .modal-sheet{background:var(--surface2);border-radius:var(--radius) var(--radius) 0 0;padding:20px 18px 30px;width:100%;max-width:500px;max-height:80vh;overflow-y:auto;border:1px solid var(--border2);border-bottom:none;backdrop-filter:blur(30px);animation:slideUp .3s ease}
        @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
        .modal-sheet h2{font-size:17px;font-weight:700;margin-bottom:4px;color:var(--accent)}
        .modal-sheet .subtitle{font-size:11px;color:var(--text3);margin-bottom:14px}
        .modal-sheet input,.modal-sheet textarea{width:100%;padding:11px 13px;border-radius:var(--radius-xs);border:1.5px solid var(--border2);background:var(--bg);color:var(--text);font-size:13px;outline:none;font-family:'Inter',sans-serif;margin-bottom:8px;resize:vertical;transition:all .15s}
        .modal-sheet input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
        .btn-row{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
        .btn{padding:10px 20px;border-radius:var(--radius-xs);border:none;font-weight:600;cursor:pointer;font-size:12px;font-family:'Inter',sans-serif;transition:all .15s}
        .btn:active{transform:scale(.95)}.btn-primary{background:var(--accent);color:#1a0a0f}.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border2)}

        .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--surface2);color:var(--text);font-size:12px;padding:10px 22px;border-radius:50px;z-index:100;opacity:0;transition:all .3s;pointer-events:none;border:1px solid var(--border2)}
        .toast.show{opacity:1}
        ::-webkit-scrollbar{width:0}
    </style>
</head>
<body>
<div class="app">
    <!-- LOGIN -->
    <div class="screen" id="login-screen">
        <div style="width:70px;height:70px;border-radius:20px;background:linear-gradient(135deg,var(--accent),var(--neon));display:flex;align-items:center;justify-content:center;box-shadow:0 0 50px var(--glow);margin-bottom:8px">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#1a0a0f" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </div>
        <h2>Welcome to NR</h2>
        <p>Your ad-free music. Sync with friends. Listen together.</p>
        <button class="btn-google" onclick="signIn()">
            <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
            Sign in with Google
        </button>
    </div>

    <!-- HOME -->
    <div class="screen hidden" id="home-screen">
        <div class="header"><h1>NR</h1><button class="avatar-btn" id="login-btn" onclick="signOut()">?</button></div>
        <div class="main-content">
            <div class="greeting"><div class="time" id="time-greet">Good Morning</div><div class="name" id="user-name">User</div></div>
            <div class="stat-grid">
                <div class="stat-card" onclick="openPage('playlists')"><div class="stat-num" id="home-playlists">0</div><div class="stat-label">Playlists</div></div>
                <div class="stat-card" onclick="openPage('friends')"><div class="stat-num" id="home-friends">0</div><div class="stat-label">Friends</div></div>
                <div class="stat-card" onclick="openPage('rooms')"><div class="stat-num" id="home-rooms">0</div><div class="stat-label">Active Rooms</div></div>
                <div class="stat-card" onclick="openModal('youtube')"><div style="font-size:28px;margin-bottom:4px">+</div><div class="stat-label">Add Music</div></div>
            </div>
            <div class="section-header"><h3>Quick Add</h3></div>
            <div class="card" onclick="openModal('youtube')"><div class="icon"><svg viewBox="0 0 24 24"><path d="M22.54 6.42a2.78 2.78 0 00-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 00-1.94 2A29.94 29.94 0 001 11.75a29.94 29.94 0 00.46 5.33 2.78 2.78 0 001.94 2C5.12 19.5 12 19.5 12 19.5s6.88 0 8.6-.46a2.78 2.78 0 001.94-2 29.94 29.94 0 00.46-5.33 29.94 29.94 0 00-.46-5.29z"/><polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02" fill="#1a0a0f"/></svg></div><div class="info"><div class="title">Paste YouTube Link</div><div class="sub">Add songs instantly</div></div></div>
            <div class="card" onclick="openModal('upload')"><div class="icon"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></div><div class="info"><div class="title">Upload MP3</div><div class="sub">Add your own music</div></div></div>
            <div class="section-header"><h3>Recently Played</h3></div>
            <div id="home-recent"><div class="empty-card">No songs played yet</div></div>
        </div>
    </div>

    <!-- PAGE SCREEN -->
    <div class="screen hidden" id="page-screen">
        <div class="header"><button class="back-btn" onclick="goHome()">←</button><h1 id="page-title">Page</h1><button class="avatar-btn" id="page-add">+</button></div>
        <div class="main-content" id="page-content"></div>
    </div>

    <!-- MINI PLAYER -->
    <div class="mini-player" id="mini-player">
        <div class="song-info"><div class="song-title" id="mini-title">No song</div><div class="song-artist" id="mini-artist">Add music to play</div></div>
        <div class="controls">
            <button class="ctrl-btn" onclick="prevSong()">⏮</button>
            <button class="ctrl-btn" id="play-pause-btn" onclick="togglePlay()">▶</button>
            <button class="ctrl-btn" onclick="nextSong()">⏭</button>
        </div>
    </div>

    <div class="modal-overlay" id="modal"><div class="modal-sheet" id="modal-content"></div></div>
    <div class="toast" id="toast"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyAr_Fcr_IbMl9syK4zxep3ar9OEHHBppT8",authDomain:"myos-8e487.firebaseapp.com",databaseURL:"https://myos-8e487-default-rtdb.asia-southeast1.firebasedatabase.app"});
const auth=firebase.auth(),db=firebase.database();const $=id=>document.getElementById(id);
let me=null,uname='User',currentPage='',queue=[],queueIndex=-1,isPlaying=false,audio=null;

function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2000)}
$('time-greet').textContent=new Date().getHours()<12?'Good Morning':new Date().getHours()<17?'Good Afternoon':'Good Evening';

window.signIn=()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
window.signOut=()=>auth.signOut();
auth.onAuthStateChanged(u=>{
    if(u){me=u;uname=u.displayName||'User';$('user-name').textContent=uname;$('login-btn').textContent=uname[0].toUpperCase();$('login-screen').classList.add('hidden');$('home-screen').classList.remove('hidden');loadHome()}
    else{me=null;$('login-screen').classList.remove('hidden');$('home-screen').classList.add('hidden');$('page-screen').classList.add('hidden')}
});

function loadHome(){
    if(!me)return;
    db.ref('users/'+me.uid+'/playlists').once('value').then(s=>{$('home-playlists').textContent=s.numChildren()});
    db.ref('users/'+me.uid+'/friends').once('value').then(s=>{$('home-friends').textContent=s.numChildren()});
    db.ref('users/'+me.uid+'/recent').limitToLast(5).once('value').then(s=>{
        const d=s.val();if(!d){$('home-recent').innerHTML='<div class="empty-card">No songs played yet</div>';return}
        $('home-recent').innerHTML=Object.values(d).reverse().map(v=>`<div class="card" onclick="playSong('${v.url}','${v.title||'Unknown'}')"><div class="icon"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3" fill="currentColor"/></svg></div><div class="info"><div class="title">${v.title||'Unknown'}</div><div class="sub">Tap to play</div></div></div>`).join('');
    });
}

// Pages
window.openPage=function(page){
    currentPage=page;const titles={playlists:'Playlists',friends:'Friends',rooms:'Rooms'};
    $('page-title').textContent=titles[page]||page;$('page-add').onclick=()=>openModal(page);
    $('home-screen').classList.add('hidden');$('page-screen').classList.remove('hidden');loadPage(page);
};
window.goHome=()=>{$('page-screen').classList.add('hidden');$('home-screen').classList.remove('hidden');loadHome()};
function loadPage(page){
    db.ref('users/'+me.uid+'/'+page).once('value').then(s=>{
        const d=s.val();let html='';
        if(d){Object.values(d).forEach(v=>html+=`<div class="card"><div class="icon"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3" fill="currentColor"/></svg></div><div class="info"><div class="title">${v.name||v.title||v}</div></div></div>`)}
        if(!html)html='<div class="empty-card">Nothing here yet</div>';
        $('page-content').innerHTML=html;
    });
}

// Modal
function openModal(type){
    const mc=$('modal-content');
    if(type==='youtube')mc.innerHTML=`<h2>Add from YouTube</h2><p class="subtitle">Paste a YouTube link to add to your library</p><input id="f1" placeholder="YouTube URL"><input id="f2" placeholder="Song title (optional)"><div class="btn-row"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="addYoutube()">Add Song</button></div>`;
    else if(type==='upload')mc.innerHTML=`<h2>Upload MP3</h2><p class="subtitle">Add your own music files</p><input id="f1" placeholder="Song title"><input type="file" id="f2" accept="audio/*"><div class="btn-row"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="uploadMP3()">Upload</button></div>`;
    else if(type==='playlists')mc.innerHTML=`<h2>New Playlist</h2><input id="f1" placeholder="Playlist name"><div class="btn-row"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="addPlaylist()">Create</button></div>`;
    else if(type==='friends')mc.innerHTML=`<h2>Add Friend</h2><input id="f1" placeholder="Friend's username"><div class="btn-row"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="addFriend()">Add</button></div>`;
    else if(type==='rooms')mc.innerHTML=`<h2>Create Room</h2><input id="f1" placeholder="Room name"><div class="btn-row"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="createRoom()">Create</button></div>`;
    $('modal').classList.add('on');
}
window.openModal=openModal;
window.closeModal=()=>$('modal').classList.remove('on');
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});

function getv(id){const el=document.getElementById(id);return el?el.value:''}
window.addYoutube=function(){
    const url=getv('f1'),title=getv('f2')||'YouTube Song';if(!url)return toast('Paste a link');
    const videoId=url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/);
    if(!videoId)return toast('Invalid YouTube link');
    const audioUrl=`https://inv.nadeko.net/latest_version?id=${videoId[1]}&itag=140`;
    db.ref('users/'+me.uid+'/songs').push({title,url:audioUrl,original:url,created:Date.now()});
    db.ref('users/'+me.uid+'/recent').push({title,url:audioUrl});
    toast('Song added');closeModal();playSong(audioUrl,title);loadHome();
};
window.uploadMP3=function(){
    const f=document.getElementById('f2')?.files[0];if(!f)return toast('Select a file');
    const title=getv('f1')||f.name;const r=new FileReader();r.onload=e=>{
        db.ref('users/'+me.uid+'/songs').push({title,url:e.target.result,created:Date.now()});
        db.ref('users/'+me.uid+'/recent').push({title,url:e.target.result});
        toast('Uploaded');closeModal();playSong(e.target.result,title);loadHome();
    };r.readAsDataURL(f);
};
window.addPlaylist=function(){const n=getv('f1');if(!n)return toast('Enter name');db.ref('users/'+me.uid+'/playlists').push({name:n,created:Date.now()});toast('Created');closeModal();loadPage('playlists')};
window.addFriend=function(){const n=getv('f1');if(!n)return toast('Enter username');db.ref('usernames/'+n).once('value').then(s=>{if(s.exists()){db.ref('users/'+me.uid+'/friends').push({name:n});toast('Friend added');closeModal()}else toast('User not found')})};
window.createRoom=function(){const n=getv('f1');if(!n)return toast('Enter room name');db.ref('rooms').push({name:n,host:uname,created:Date.now()});toast('Room created');closeModal()};

// Player
function playSong(url,title){
    if(audio){audio.pause();audio=null}
    try{audio=new Audio(url);audio.play();isPlaying=true;$('mini-title').textContent=title;$('mini-artist').textContent='Now Playing';$('play-pause-btn').textContent='⏸';$('mini-player').classList.add('show');
        audio.onended=()=>{isPlaying=false;$('play-pause-btn').textContent='▶';nextSong()};
        audio.onerror=()=>{toast('Cannot play this song. Trying alternative...');$('mini-artist').textContent='Error playing';}}catch(e){toast('Playback failed')}
}
window.togglePlay=()=>{if(!audio)return;if(isPlaying){audio.pause();isPlaying=false;$('play-pause-btn').textContent='▶'}else{audio.play();isPlaying=true;$('play-pause-btn').textContent='⏸'}};
window.nextSong=()=>toast('Next song (queue coming soon)');
window.prevSong=()=>toast('Previous song (queue coming soon)');
</script>
</body>
</html>
