<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               minimum-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>NAKUL SHARMA</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #000;
    color: white;

    font-family: Arial, sans-serif;

    /* Prevent mobile browsers from automatically resizing text */
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
}

.intro {
    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;

    background:
        radial-gradient(
            circle at center,
            #181818 0%,
            #080808 45%,
            #000000 80%
        );

    animation: disappear 1.2s ease 6.3s forwards;
}


/* MAIN CONTENT */

.content {

    width: 100%;

    padding-left: 20px;
    padding-right: 20px;

    text-align: center;

    animation: cinematic 2s ease forwards;
}


/* SMALL TEXT */

.owner {

    width: 100%;

    font-size: 12px;

    letter-spacing: 4px;

    color: #999;

    opacity: 0;

    animation: fadeUp 1.2s ease .4s forwards;
}


/* NAME */

.name {

    width: 100%;

    margin-top: 18px;

    font-size: 60px;

    line-height: 1;

    font-weight: 800;

    letter-spacing: 7px;

    color: white;

    white-space: nowrap;

    opacity: 0;

    animation:
        fadeUp 1.4s ease .8s forwards,
        glow 3s ease-in-out 2s infinite alternate;
}


/* LINE */

.line {

    width: 0;

    max-width: 70%;

    height: 1px;

    background: white;

    margin: 28px auto;

    animation: lineGrow 1.3s ease 2s forwards;
}


/* COPYRIGHT */

.copyright {

    width: 100%;

    font-size: 11px;

    letter-spacing: 3px;

    color: #777;

    white-space: nowrap;

    opacity: 0;

    animation: fadeUp 1.2s ease 2.3s forwards;
}


/* LOADING */

.loading {

    position: fixed;

    left: 0;
    bottom: 35px;

    width: 100%;

    text-align: center;

    font-size: 10px;

    letter-spacing: 3px;

    color: #555;

    opacity: 0;

    animation: fadeUp 1s ease 3.5s forwards;
}


/* PHONE */

@media screen and (max-width: 600px) {

    .content {
        padding-left: 12px;
        padding-right: 12px;
    }

    .owner {
        font-size: 9px;
        letter-spacing: 3px;
    }

    .name {
        font-size: 11vw;
        letter-spacing: 2px;
    }

    .copyright {
        font-size: 7px;
        letter-spacing: 1.5px;
    }

    .line {
        margin: 20px auto;
        max-width: 60%;
    }

    .loading {
        font-size: 8px;
        letter-spacing: 2px;
        bottom: 25px;
    }
}


/* VERY SMALL PHONE */

@media screen and (max-width: 380px) {

    .name {
        font-size: 10vw;
        letter-spacing: 1px;
    }

    .owner {
        font-size: 8px;
    }

    .copyright {
        font-size: 6px;
    }
}


/* ANIMATIONS */

@keyframes cinematic {

    0% {
        transform: scale(1.15);
        filter: blur(15px);
    }

    100% {
        transform: scale(1);
        filter: blur(0);
    }
}

@keyframes fadeUp {

    0% {
        opacity: 0;
        transform: translateY(20px);
    }

    100% {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes lineGrow {

    0% {
        width: 0;
    }

    100% {
        width: 260px;
    }
}

@keyframes glow {

    from {
        text-shadow: 0 0 0px white;
    }

    to {
        text-shadow: 0 0 18px rgba(255,255,255,.35);
    }
}

@keyframes disappear {

    to {
        opacity: 0;
        visibility: hidden;
    }
}

</style>
</head>

<body>

<div class="intro">

    <div class="content">

        <div class="owner">
            OWNED AND OPERATED BY
        </div>

        <div class="name">
            NAKUL SHARMA
        </div>

        <div class="line"></div>

        <div class="copyright">
            © NAKUL SHARMA — ALL RIGHTS RESERVED
        </div>

    </div>

    <div class="loading">
        LOADING EXPERIENCE
    </div>

</div>


<script>

setTimeout(function() {

    window.location.replace("game.html");

}, 7500);

</script>

</body>
</html>
